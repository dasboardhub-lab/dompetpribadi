<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyKeuangan - Friendly Compact</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts: Plus Jakarta Sans (Rounded Feel) -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* THEME CONFIGURATION - FRIENDLY */
        :root {
            --primary: #8b5cf6; /* Violet 500 */
            --primary-dark: #7c3aed; /* Violet 600 */
            --primary-light: #ddd6fe; /* Violet 200 */
            --bg-page: #f8fafc;
            --surface: #ffffff;
            --text-main: #334155;
            --text-muted: #94a3b8;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-page);
            background-image: radial-gradient(#e0e7ff 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--text-main);
        }
        
        /* Custom Scrollbar - Cute & Round */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; border: 2px solid transparent; background-clip: content-box; }
        ::-webkit-scrollbar-thumb:hover { background-color: #a0aec0; }
        
        /* Animations */
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.9) translateY(10px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-5px); } 100% { transform: translateY(0px); } }
        
        .animate-pop-in { animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .hover-float:hover { animation: float 2s ease-in-out infinite; }
        
        /* Smooth Accordion */
        .grid-rows-0 { grid-template-rows: 0fr; }
        .grid-rows-1 { grid-template-rows: 1fr; }
        
        /* Dynamic Island - Glassy & Dark */
        .dynamic-island {
            position: fixed;
            top: 1.5rem;
            left: 50%;
            transform: translateX(-50%) translateY(-200%);
            background: rgba(15, 23, 42, 0.85); /* Slate 900 */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 100;
            box-shadow: 0 20px 40px -5px rgba(0, 0, 0, 0.2);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            width: auto;
            max-width: 90%;
            opacity: 0;
            font-size: 0.9rem;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .dynamic-island.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Styling Inputs Friendly - COMPACTED */
        .label-text { 
            display: block; font-size: 0.85rem; font-weight: 600; color: #475569; 
            margin-bottom: 0.5rem; letter-spacing: 0.01em;
        }
        .input-field { 
            width: 100%; padding: 0.875rem 1.25rem; /* Padding lebih proporsional */
            background: #f8fafc; border: 1px solid #cbd5e1; 
            border-radius: 1rem; outline: none; transition: all 0.3s ease; 
            font-weight: 600; color: #334155; font-size: 0.95rem; 
        }
        .input-field:focus { 
            background: #fff; border-color: var(--primary); 
            box-shadow: 0 0 0 4px var(--primary-light); 
        }
        
        /* Buttons - COMPACTED */
        .btn-primary { 
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            color: white; padding: 1rem; /* Padding standar */
            border-radius: 1rem; 
            font-weight: 700; font-size: 1rem; transition: all 0.3s; 
            box-shadow: 0 4px 12px -2px rgba(139, 92, 246, 0.4);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px -4px rgba(139, 92, 246, 0.5); }
        .btn-primary:active { transform: translateY(0) scale(0.98); }

        .btn-option { 
            padding: 0.75rem; border-radius: 0.85rem; border: 1px solid #e2e8f0; 
            font-size: 0.9rem; font-weight: 600; color: #64748b; background: white; transition: all 0.2s; 
        }
        .btn-option:hover { border-color: #cbd5e1; background: #f8fafc; }
        .btn-option.active { 
            background-color: #ede9fe; border-color: #8b5cf6; color: #7c3aed; 
        }

        /* Glassmorphism Utilities */
        .glass-nav { 
            background: rgba(255, 255, 255, 0.8); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8); 
        }
        .card-friendly {
            background: white; border-radius: 1.25rem; /* Radius sedikit dikurangi agar lebih serius */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 10px 15px -3px rgba(0, 0, 0, 0.03);
            border: 1px solid #f1f5f9;
        }

        .currency-prefix { position: absolute; left: 1.25rem; top: 1rem; color: #94a3b8; font-weight: 700; font-size: 0.95rem; }
    </style>
</head>
<body class="text-slate-800 h-screen overflow-hidden flex flex-col">

    <div id="app" class="flex flex-col h-full w-full">
        <!-- Initial Loader -->
        <div class="m-auto text-center flex flex-col items-center">
            <div class="relative w-20 h-20 mb-6">
                <div class="absolute inset-0 bg-violet-100 rounded-full animate-ping opacity-75"></div>
                <div class="relative bg-white p-4 rounded-full shadow-xl border-2 border-violet-50">
                    <svg class="text-violet-500 w-full h-full animate-bounce" data-lucide="wallet-cards" stroke-width="2"></svg>
                </div>
            </div>
            <p class="text-slate-400 text-sm font-bold tracking-wider animate-pulse">Menyiapkan Dompetmu...</p>
        </div>
    </div>

    <!-- Dynamic Island Element -->
    <div id="dynamic-island" class="dynamic-island">
        <div id="island-icon"></div>
        <div class="flex flex-col">
            <span id="island-title" class="font-bold leading-tight">Notifikasi</span>
            <span id="island-message" class="text-[11px] text-slate-300 leading-tight">Pesan disini</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // FIREBASE CONFIG (SAME AS BEFORE)
        const firebaseConfig = {
            apiKey: "AIzaSyDXOfZbVDqtfGB0abQkTeILo-XC6a9xxKI",
            authDomain: "hub-dashboard-92428.firebaseapp.com",
            projectId: "hub-dashboard-92428",
            storageBucket: "hub-dashboard-92428.firebasestorage.app",
            messagingSenderId: "827243064075",
            appId: "1:827243064075:web:21b8e40b88f13b2433d00e"
        };

        const appFirebase = initializeApp(firebaseConfig);
        const auth = getAuth(appFirebase);
        const db = getFirestore(appFirebase);
        const appId = 'my-finance-app-v1'; 

        // COLORS & ICONS
        const colorOptions = ['bg-rose-400', 'bg-orange-400', 'bg-amber-400', 'bg-yellow-400', 'bg-lime-400', 'bg-emerald-400', 'bg-teal-400', 'bg-cyan-400', 'bg-sky-400', 'bg-blue-400', 'bg-indigo-400', 'bg-violet-400', 'bg-purple-400', 'bg-fuchsia-400', 'bg-pink-400', 'bg-slate-400'];
        const iconOptions = ['star', 'heart', 'coffee', 'zap', 'gift', 'shopping-bag', 'music', 'gamepad-2', 'book', 'briefcase', 'home', 'car', 'plane', 'utensils', 'smartphone', 'wifi', 'droplet', 'sun', 'moon', 'smile', 'ghost', 'cat', 'dog', 'fish', 'flower', 'tree-deciduous', 'monitor', 'tv', 'headphones', 'camera', 'video', 'ticket', 'map', 'flag', 'key', 'lock', 'tool', 'hammer', 'credit-card', 'banknote', 'wallet', 'piggy-bank', 'coins', 'landmark', 'pie-chart'];

        // --- UTILS ---
        const toLocalISO = (date) => { const offset = date.getTimezoneOffset() * 60000; return new Date(date.getTime() - offset).toISOString().split('T')[0]; };
        const getToday = () => toLocalISO(new Date());
        const getFirstDayOfMonth = () => { const d = new Date(); d.setDate(1); return toLocalISO(d); };
        const getLastDayOfMonth = () => { const d = new Date(); d.setMonth(d.getMonth() + 1); d.setDate(0); return toLocalISO(d); };
        const formatNumberString = (numStr) => { const num = numStr.replace(/\D/g, ''); return num ? new Intl.NumberFormat('id-ID').format(num) : ''; };
        const formatRupiah = (number) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
        const formatDate = (dateString) => { if (!dateString) return '-'; return new Date(dateString).toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }); };
        const getCollectionName = (tab) => { if (tab === 'expense') return 'expense_categories'; if (tab === 'income') return 'income_categories'; if (tab === 'wallets') return 'wallets'; if (tab === 'transactions') return 'transactions'; if (tab === 'debts') return 'debts'; return 'unknown'; };

        // --- STATE ---
        const state = {
            user: null, accessCode: localStorage.getItem('finance_access_code') || null, isLoading: true, isSubmitting: false, 
            activeMenu: 'dashboard', settingsTab: 'expense', shouldRefreshContent: true, lastRenderedMenu: null,
            // Modals
            isSettingsModalOpen: false, isTransactionModalOpen: false, isTransferModalOpen: false, isDebtModalOpen: false, isPayDebtModalOpen: false,
            confirmModal: { isOpen: false, title: '', message: '', onConfirm: null, type: 'danger' },
            notification: { show: false, title: '', message: '', type: 'success', timeout: null },
            // Edit
            editingItem: null, editingTxId: null, selectedDebt: null, selectedPersonGroup: null, // NEW: Added selectedPersonGroup
            loginCodeInput: '', expandedPerson: null,
            filter: { type: 'all', startDate: getFirstDayOfMonth(), endDate: getLastDayOfMonth() },
            dashboardFilter: { type: 'all', walletId: 'all', startDate: getFirstDayOfMonth(), endDate: getLastDayOfMonth(), periodMode: 'monthly' },
            // Forms
            settingsForm: { name: '', budget: '', initialBalance: '', type: 'Cash', icon: 'star', color: 'bg-indigo-400' },
            txForm: { type: 'expense', date: getToday(), amount: '', walletId: '', categoryId: '', notes: '' },
            transferForm: { date: getToday(), amount: '', fromWalletId: '', toWalletId: '', notes: '' },
            debtForm: { type: 'payable', person: '', amount: '', date: getToday(), dueDate: '', notes: '', isOldDebt: false, walletId: '' },
            payDebtForm: { date: getToday(), amount: '', walletId: '', notes: '' },
            // Data
            data: { expense: [], income: [], wallets: [], transactions: [], debts: [] },
            unsubscribeListeners: []
        };

        // --- APP LOGIC ---
        function showNotification(title, message, type = 'success') {
            const island = document.getElementById('dynamic-island');
            const islandTitle = document.getElementById('island-title');
            const islandMsg = document.getElementById('island-message');
            const islandIcon = document.getElementById('island-icon');
            if (!island) return;
            islandTitle.innerText = title;
            islandMsg.innerText = message;
            let iconSvg = '';
            if (type === 'success') iconSvg = `<div class="bg-emerald-500 rounded-full p-1"><svg class="text-white w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" /></svg></div>`;
            else iconSvg = `<div class="bg-rose-500 rounded-full p-1"><svg class="text-white w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12" /></svg></div>`;
            islandIcon.innerHTML = iconSvg;
            island.classList.add('show');
            if (state.notification.timeout) clearTimeout(state.notification.timeout);
            state.notification.timeout = setTimeout(() => { island.classList.remove('show'); }, 3000);
        }

        function triggerConfirm(title, message, onConfirm, type = 'danger') { state.confirmModal = { isOpen: true, title, message, onConfirm, type }; render(); }
        function closeConfirm() { state.confirmModal = { isOpen: false, title: '', message: '', onConfirm: null, type: 'danger' }; render(); }
        function executeConfirm() { if (state.confirmModal.onConfirm) state.confirmModal.onConfirm(); closeConfirm(); }

        function updateNavbarActiveState() {
            ['dashboard', 'debts', 'settings'].forEach(id => {
                const btn = document.getElementById(`nav-btn-${id}`);
                if (btn) {
                    if (state.activeMenu === id) {
                        btn.className = "relative px-5 py-2.5 rounded-full text-xs font-bold transition-all duration-300 flex items-center gap-2 bg-slate-800 text-white shadow-xl shadow-slate-200 transform scale-105";
                    } else {
                        btn.className = "relative px-5 py-2.5 rounded-full text-xs font-bold transition-all duration-300 flex items-center gap-2 text-slate-400 hover:text-indigo-500 hover:bg-indigo-50";
                    }
                }
            });
        }
        
        function updateVisualSelection(selector, value, activeClass, inactiveClass) {
            const buttons = document.querySelectorAll(selector);
            buttons.forEach(btn => {
                if (btn.dataset.value === value) btn.className = activeClass;
                else btn.className = inactiveClass;
            });
        }

        function cleanupListeners() { state.unsubscribeListeners.forEach(unsub => unsub()); state.unsubscribeListeners = []; state.data = { expense: [], income: [], wallets: [], transactions: [], debts: [] }; }
        function initDataListeners(code) {
            if (!code) return;
            cleanupListeners(); 
            const userId = `code_${code}`; 
            const refresh = () => { state.shouldRefreshContent = true; render(); };
            ['expense', 'income', 'wallets'].forEach(key => {
                const unsub = onSnapshot(query(collection(db, 'artifacts', appId, 'users', userId, getCollectionName(key))), (snapshot) => {
                    const items = []; snapshot.forEach((doc) => items.push({ id: doc.id, ...doc.data() })); state.data[key] = items; refresh();
                });
                state.unsubscribeListeners.push(unsub);
            });
            const unsubTx = onSnapshot(query(collection(db, 'artifacts', appId, 'users', userId, 'transactions')), (snapshot) => {
                const items = []; snapshot.forEach((doc) => items.push({ id: doc.id, ...doc.data() })); state.data.transactions = items.sort((a, b) => new Date(b.date) - new Date(a.date)); refresh();
            });
            state.unsubscribeListeners.push(unsubTx);
            const unsubDebt = onSnapshot(query(collection(db, 'artifacts', appId, 'users', userId, 'debts')), (snapshot) => {
                const items = []; snapshot.forEach((doc) => items.push({ id: doc.id, ...doc.data() })); state.data.debts = items.sort((a, b) => new Date(b.date) - new Date(a.date)); refresh();
            });
            state.unsubscribeListeners.push(unsubDebt);
        }

        // --- WINDOW APP METHODS ---
        window.app = {
            handleLoginInput: (val) => { state.loginCodeInput = val.toUpperCase().replace(/[^A-Z0-9]/g, ''); const el = document.getElementById('login-input'); if(el && el.value !== state.loginCodeInput) el.value = state.loginCodeInput; },
            login: (e) => { e.preventDefault(); if (!state.loginCodeInput || state.loginCodeInput.length < 3) return showNotification('Waduh', 'Kodenya terlalu pendek', 'error'); state.accessCode = state.loginCodeInput; localStorage.setItem('finance_access_code', state.accessCode); initDataListeners(state.accessCode); showNotification('Hore!', 'Berhasil masuk', 'success'); state.shouldRefreshContent = true; render(); },
            logout: () => { triggerConfirm('Mau Keluar?', 'Yakin nih mau udahan dulu?', () => { cleanupListeners(); state.accessCode = null; state.loginCodeInput = ''; localStorage.removeItem('finance_access_code'); state.activeMenu = 'dashboard'; document.getElementById('app').innerHTML = ''; render(); }, 'danger'); },
            setMenu: (menu) => { if (state.activeMenu !== menu) { state.activeMenu = menu; state.shouldRefreshContent = true; render(); } },
            setSettingsTab: (tab) => { state.settingsTab = tab; state.shouldRefreshContent = true; render(); },
            toggleExpandPerson: (personName) => { 
                state.expandedPerson = state.expandedPerson === personName ? null : personName;
                const safeId = personName.replace(/[^a-zA-Z0-9]/g, '_');
                const detailEl = document.getElementById(`details-${safeId}`);
                const iconEl = document.getElementById(`icon-${safeId}`);
                if (detailEl) {
                    if (detailEl.classList.contains('grid-rows-0')) { detailEl.classList.remove('grid-rows-0'); detailEl.classList.add('grid-rows-1'); if (iconEl) iconEl.style.transform = 'rotate(180deg)'; } 
                    else { detailEl.classList.add('grid-rows-0'); detailEl.classList.remove('grid-rows-1'); if (iconEl) iconEl.style.transform = 'rotate(0deg)'; }
                }
            },
            setTxFilter: (field, value) => { state.filter[field] = value; state.shouldRefreshContent = true; render(); },
            
            // PERBAIKAN: Tambahkan parameter skipRender agar tidak refresh saat ketik tanggal
            setDashboardFilter: (field, value, skipRender = false) => { 
                state.dashboardFilter[field] = value; 
                if (!skipRender) {
                    state.shouldRefreshContent = true; 
                    render(); 
                }
            },
            // PERBAIKAN: Fungsi baru untuk tombol "Cari" tanggal
            applyDateFilter: () => {
                state.shouldRefreshContent = true;
                render();
            },

            resetDashboardFilter: () => { state.dashboardFilter = { type: 'all', walletId: 'all', startDate: getFirstDayOfMonth(), endDate: getLastDayOfMonth(), periodMode: 'monthly' }; state.shouldRefreshContent = true; render(); },
            toggleWalletExclusion: async (id, currentIsExcluded) => { try { await updateDoc(doc(db, 'artifacts', appId, 'users', `code_${state.accessCode}`, 'wallets', id), { isExcluded: !currentIsExcluded }); } catch (err) { console.error(err); } },
            openSettingsModal: (mode, id = null, tabName = null) => {
                if (tabName) state.settingsTab = tabName; 
                if (mode === 'edit' && id) { const item = state.data[state.settingsTab].find(i => i.id === id); state.editingItem = item; state.settingsForm = { name: item.name, budget: item.budget || '', initialBalance: item.initialBalance || '', type: item.type || 'Cash', icon: item.icon, color: item.color }; } 
                else { state.editingItem = null; state.settingsForm = { name: '', budget: '', initialBalance: '', type: 'Cash', icon: 'star', color: 'bg-indigo-400' }; }
                state.isSettingsModalOpen = true; state.shouldRefreshContent = false; render();
            },
            openTransactionModal: () => { state.editingTxId = null; state.txForm = { type: 'expense', date: getToday(), amount: '', walletId: state.data.wallets[0]?.id || '', categoryId: '', notes: '' }; state.isTransactionModalOpen = true; state.shouldRefreshContent = false; render(); },
            
            // PERBAIKAN: Logika Edit Transaksi yang mendeteksi Pembayaran Hutang
            editTransaction: (id) => {
                const tx = state.data.transactions.find(t => t.id === id); if (!tx) return;
                
                // CASE 1: Edit Pembayaran Hutang/Piutang
                if (tx.isDebtPayment) {
                    let personName = '';
                    let type = '';
                    
                    // Cari nama orang berdasarkan data distribusi atau legacy ID
                    if (tx.paymentDistribution && tx.paymentDistribution.length > 0) {
                        const debt = state.data.debts.find(d => d.id === tx.paymentDistribution[0].debtId);
                        if (debt) { personName = debt.person; type = debt.type; }
                    } else if (tx.relatedDebtId) {
                        const debt = state.data.debts.find(d => d.id === tx.relatedDebtId);
                        if (debt) { personName = debt.person; type = debt.type; }
                    }

                    // Fallback parse dari notes jika data hutang sudah dihapus
                    if (!personName && tx.notes) {
                        const parts = tx.notes.split(' ');
                        if (parts.length >= 3) {
                             personName = parts.slice(2).join(' ');
                             type = tx.notes.includes('Hutang') ? 'payable' : 'receivable';
                        }
                    }

                    if (personName) {
                        // Hitung total sisa seolah-olah pembayaran ini belum terjadi (untuk limit edit)
                        const personDebts = state.data.debts.filter(d => d.person === personName && d.type === type);
                        let currentTotalRemaining = personDebts.reduce((sum, d) => sum + (d.amount - (d.paidAmount || 0)), 0);
                        const totalSisaForEdit = currentTotalRemaining + tx.amount;

                        state.selectedPersonGroup = { name: personName, type: type, total: totalSisaForEdit };
                        state.payDebtForm = { date: tx.date, amount: tx.amount, walletId: tx.walletId, notes: tx.notes, type: type }; 
                        state.editingTxId = id; // Tandai sedang mengedit
                        state.isPayDebtModalOpen = true; 
                        state.shouldRefreshContent = false; 
                        render();
                        return;
                    }
                }

                // CASE 2: Edit Transfer
                if (tx.type === 'transfer') { 
                    state.transferForm = { date: tx.date, amount: tx.amount, fromWalletId: tx.fromWalletId, toWalletId: tx.toWalletId, notes: tx.notes || '' }; state.editingTxId = id; state.isTransferModalOpen = true; 
                } 
                // CASE 3: Edit Transaksi Biasa
                else { 
                    state.txForm = { type: tx.type, date: tx.date, amount: tx.amount, walletId: tx.walletId, categoryId: tx.categoryId, notes: tx.notes || '' }; state.editingTxId = id; state.isTransactionModalOpen = true; 
                }
                state.shouldRefreshContent = false; render();
            },

            deleteTransaction: (id) => { 
                triggerConfirm('Hapus & Batalkan?', 'Menghapus transaksi ini akan mengembalikan saldo hutang/piutang seperti semula.', async () => { 
                    try { 
                        const txRef = window.app.getDocPath('transactions', id);
                        const txSnap = await getDoc(txRef);
                        
                        if (txSnap.exists()) {
                            const tx = txSnap.data();
                            
                            // Jika ini transaksi pembayaran hutang, kembalikan saldonya
                            if (tx.isDebtPayment) {
                                // CASE A: Pembayaran Massal (Format Baru)
                                if (tx.paymentDistribution && Array.isArray(tx.paymentDistribution)) {
                                    for (const dist of tx.paymentDistribution) {
                                        const debtRef = window.app.getDocPath('debts', dist.debtId);
                                        const debtSnap = await getDoc(debtRef);
                                        if (debtSnap.exists()) {
                                            const debt = debtSnap.data();
                                            const newPaid = Math.max(0, (debt.paidAmount || 0) - dist.amount);
                                            await updateDoc(debtRef, {
                                                paidAmount: newPaid,
                                                status: 'active', // Status kembali aktif karena pembayaran ditarik
                                                updatedAt: new Date().toISOString()
                                            });
                                        }
                                    }
                                } 
                                // CASE B: Pembayaran Tunggal (Format Lama/Legacy)
                                else if (tx.relatedDebtId) {
                                    const debtRef = window.app.getDocPath('debts', tx.relatedDebtId);
                                    const debtSnap = await getDoc(debtRef);
                                    if (debtSnap.exists()) {
                                        const debt = debtSnap.data();
                                        const newPaid = Math.max(0, (debt.paidAmount || 0) - tx.amount);
                                        await updateDoc(debtRef, {
                                            paidAmount: newPaid,
                                            status: 'active',
                                            updatedAt: new Date().toISOString()
                                        });
                                    }
                                }
                            }
                            
                            // Hapus transaksi setelah saldo dikembalikan
                            await deleteDoc(txRef); 
                            showNotification('Sip', 'Transaksi dihapus & Saldo dikembalikan'); 
                        }
                    } catch (err) { 
                        console.error(err); 
                        showNotification('Gagal', 'Gagal menghapus data', 'error');
                    } 
                }, 'danger'); 
            },

            setSettingsIcon: (i) => { state.settingsForm.icon = i; updateVisualSelection('.settings-icon-btn', i, `settings-icon-btn p-2.5 rounded-2xl flex justify-center transition-all bg-indigo-500 text-white shadow-lg scale-110 rotate-3`, `settings-icon-btn p-2.5 rounded-2xl flex justify-center transition-all bg-white text-slate-300 hover:bg-slate-100 hover:text-slate-500 shadow-sm`); },
            updateForm: (formName, field, value) => { state[formName][field] = value; },
            handleNumberInput: (targetObj, field, el) => { 
                // PERBAIKAN: Deteksi tanda minus di awal input
                const isNegative = el.value.startsWith('-');
                let rawValue = el.value.replace(/\D/g, ''); 
                
                if (rawValue.length > 1 && rawValue.startsWith('0')) rawValue = rawValue.substring(1); 
                
                // Simpan value (jadikan negatif jika ada tanda minus)
                let numVal = rawValue === '' ? '' : parseInt(rawValue, 10);
                if (isNegative && numVal !== '') numVal = -numVal;
                
                state[targetObj][field] = numVal; 
                
                // Format tampilan kembali
                let formatted = formatNumberString(rawValue); 
                if (isNegative) formatted = '-' + formatted;
                
                if (el.value !== formatted) { 
                    const start = el.selectionStart; 
                    const drift = formatted.length - el.value.length; 
                    el.value = formatted; 
                    const newPos = Math.max(0, start + drift); 
                    if(el.setSelectionRange) el.setSelectionRange(newPos, newPos); 
                } 
            },
            getDbPath: (col) => collection(db, 'artifacts', appId, 'users', `code_${state.accessCode}`, col),
            getDocPath: (col, id) => doc(db, 'artifacts', appId, 'users', `code_${state.accessCode}`, col, id),
            
            submitSettings: async (e) => { e.preventDefault(); if (!state.accessCode) return; state.isSubmitting = true; render(); const { settingsTab, settingsForm, editingItem } = state; const colName = getCollectionName(settingsTab); const newItem = { name: settingsForm.name, icon: settingsForm.icon, color: settingsForm.color, updatedAt: new Date().toISOString() }; if (settingsTab === 'wallets') { newItem.type = settingsForm.type; newItem.initialBalance = Number(settingsForm.initialBalance); } else { newItem.budget = Number(settingsForm.budget); } try { if (editingItem) { await updateDoc(window.app.getDocPath(colName, editingItem.id), newItem); showNotification('Asik', 'Berhasil update!'); } else { newItem.createdAt = new Date().toISOString(); await addDoc(window.app.getDbPath(colName), newItem); showNotification('Yey', 'Item baru ditambahkan!'); } state.isSettingsModalOpen = false; } catch (err) { console.error(err); showNotification('Ups', 'Gagal simpan', 'error'); } finally { state.isSubmitting = false; render(); } },
            deleteSettingsItem: (tab, id) => { state.settingsTab = tab; triggerConfirm('Hapus?', 'Gak bisa dibalikin lho.', async () => { try { await deleteDoc(window.app.getDocPath(getCollectionName(tab), id)); showNotification('Dihapus', 'Sudah hilang'); } catch (err) { console.error(err); } }, 'danger'); },
            submitTransaction: async (e) => { e.preventDefault(); if (!state.accessCode) return; const { txForm, editingTxId } = state; if (!txForm.categoryId || !txForm.walletId || !txForm.amount) return showNotification('Eits', 'Data belum lengkap', 'error'); state.isSubmitting = true; render(); const txData = { type: txForm.type, date: txForm.date, amount: Number(txForm.amount), walletId: txForm.walletId, categoryId: txForm.categoryId, notes: txForm.notes, updatedAt: new Date().toISOString() }; try { if (editingTxId) { await updateDoc(window.app.getDocPath('transactions', editingTxId), txData); showNotification('Mantap', 'Transaksi diupdate'); } else { txData.createdAt = new Date().toISOString(); await addDoc(window.app.getDbPath('transactions'), txData); showNotification('Sukses', 'Transaksi dicatat'); } state.isTransactionModalOpen = false; state.editingTxId = null; } catch (err) { console.error(err); showNotification('Gagal', 'Coba lagi ya', 'error'); } finally { state.isSubmitting = false; render(); } },
            submitTransfer: async (e) => { e.preventDefault(); if (!state.accessCode) return; const { transferForm, editingTxId } = state; if (!transferForm.fromWalletId || !transferForm.toWalletId || !transferForm.amount) return showNotification('Eits', 'Lengkapi dulu datanya', 'error'); state.isSubmitting = true; render(); const txData = { type: 'transfer', date: transferForm.date, amount: Number(transferForm.amount), fromWalletId: transferForm.fromWalletId, toWalletId: transferForm.toWalletId, notes: transferForm.notes, updatedAt: new Date().toISOString() }; try { if (editingTxId) { await updateDoc(window.app.getDocPath('transactions', editingTxId), txData); showNotification('Oke', 'Transfer diupdate'); } else { txData.createdAt = new Date().toISOString(); await addDoc(window.app.getDbPath('transactions'), txData); showNotification('Berhasil', 'Uang sudah pindah'); } state.isTransferModalOpen = false; state.editingTxId = null; } catch (err) { console.error(err); showNotification('Gagal', 'Ada masalah', 'error'); } finally { state.isSubmitting = false; render(); } },
            submitDebt: async (e) => { e.preventDefault(); if (!state.accessCode) return; const { debtForm } = state; if (!debtForm.person || !debtForm.amount) return showNotification('Eits', 'Isi dulu yang lengkap', 'error'); if (!debtForm.isOldDebt && !debtForm.walletId) return showNotification('Peringatan', 'Pilih dompet dulu', 'error'); state.isSubmitting = true; render(); const newDebt = { type: debtForm.type, person: debtForm.person, amount: Number(debtForm.amount), paidAmount: 0, date: debtForm.date, dueDate: debtForm.dueDate || null, notes: debtForm.notes, isOldDebt: debtForm.isOldDebt, status: 'active', createdAt: new Date().toISOString() }; try { const docRef = await addDoc(window.app.getDbPath('debts'), newDebt); if (!debtForm.isOldDebt) { const isPayable = debtForm.type === 'payable'; const txData = { type: isPayable ? 'income' : 'expense', date: debtForm.date, amount: Number(debtForm.amount), walletId: debtForm.walletId, categoryId: isPayable ? 'DEBT_IN' : 'DEBT_OUT', notes: `${isPayable ? 'Hutang dari' : 'Piutang ke'} ${debtForm.person}: ${debtForm.notes}`, relatedDebtId: docRef.id, createdAt: new Date().toISOString() }; await addDoc(window.app.getDbPath('transactions'), txData); } state.isDebtModalOpen = false; showNotification('Sip', 'Hutang dicatat'); } catch (err) { console.error(err); showNotification('Gagal', 'Error nih', 'error'); } finally { state.isSubmitting = false; render(); } },
            
            // PERBAIKAN: Logika Simpan Pembayaran (Support Edit dengan Rollback)
            submitDebtPayment: async (e) => { 
                e.preventDefault(); 
                if (!state.accessCode) return; 
                const { payDebtForm, selectedPersonGroup, editingTxId } = state; 
                if (!payDebtForm.amount || !payDebtForm.walletId) return showNotification('Eits', 'Data kurang', 'error'); 
                
                let paymentAmount = Number(payDebtForm.amount);
                if (paymentAmount > selectedPersonGroup.total) return showNotification('Kelebihan', 'Melebihi total tagihan', 'error'); 

                state.isSubmitting = true; render(); 
                
                try { 
                    // TAHAP 1: ROLLBACK JIKA SEDANG EDIT
                    // Kembalikan saldo hutang seperti sebelum transaksi ini terjadi
                    if (editingTxId) {
                        const oldTx = state.data.transactions.find(t => t.id === editingTxId);
                        if (oldTx && oldTx.isDebtPayment) {
                             if (oldTx.paymentDistribution && Array.isArray(oldTx.paymentDistribution)) {
                                for (const dist of oldTx.paymentDistribution) {
                                    const debt = state.data.debts.find(d => d.id === dist.debtId);
                                    if (debt) {
                                        const newPaid = Math.max(0, (debt.paidAmount || 0) - dist.amount);
                                        await updateDoc(window.app.getDocPath('debts', debt.id), {
                                            paidAmount: newPaid,
                                            status: 'active',
                                            updatedAt: new Date().toISOString()
                                        });
                                        // Update state lokal manual agar tahap 2 membaca data yang benar
                                        debt.paidAmount = newPaid; 
                                    }
                                }
                            } else if (oldTx.relatedDebtId) {
                                const debt = state.data.debts.find(d => d.id === oldTx.relatedDebtId);
                                if (debt) {
                                    const newPaid = Math.max(0, (debt.paidAmount || 0) - oldTx.amount);
                                    await updateDoc(window.app.getDocPath('debts', debt.id), { paidAmount: newPaid, status: 'active', updatedAt: new Date().toISOString() });
                                    debt.paidAmount = newPaid;
                                }
                            }
                        }
                    }

                    // TAHAP 2: DISTRIBUSI PEMBAYARAN BARU
                    // Ambil hutang yang masih aktif, urutkan dari yang terlama
                    const personDebts = state.data.debts.filter(d => 
                        d.person === selectedPersonGroup.name && 
                        d.type === selectedPersonGroup.type && 
                        (d.amount - (d.paidAmount || 0) > 0)
                    ).sort((a, b) => new Date(a.date) - new Date(b.date));

                    let remainingToPay = paymentAmount;
                    const paymentDistribution = []; 

                    for (const debt of personDebts) {
                        if (remainingToPay <= 0) break;

                        const debtRemaining = debt.amount - (debt.paidAmount || 0);
                        const payForThis = Math.min(remainingToPay, debtRemaining);
                        
                        const newPaidTotal = (debt.paidAmount || 0) + payForThis;
                        const newStatus = newPaidTotal >= debt.amount ? 'paid' : 'active';
                        
                        await updateDoc(window.app.getDocPath('debts', debt.id), { 
                            paidAmount: newPaidTotal, 
                            status: newStatus, 
                            updatedAt: new Date().toISOString() 
                        });
                        
                        paymentDistribution.push({ debtId: debt.id, amount: payForThis });
                        remainingToPay -= payForThis;
                    }

                    // TAHAP 3: SIMPAN/UPDATE TRANSAKSI
                    const isPayable = selectedPersonGroup.type === 'payable'; 
                    const txData = { 
                        type: isPayable ? 'expense' : 'income', 
                        date: payDebtForm.date, 
                        amount: paymentAmount, 
                        walletId: payDebtForm.walletId, 
                        categoryId: 'DEBT_PAYMENT', 
                        notes: `Pelunasan ${isPayable ? 'Hutang' : 'Piutang'} ${selectedPersonGroup.name}`, 
                        updatedAt: new Date().toISOString(), 
                        isDebtPayment: true,
                        paymentDistribution: paymentDistribution 
                    }; 

                    if (editingTxId) {
                        await updateDoc(window.app.getDocPath('transactions', editingTxId), txData);
                        showNotification('Sip', 'Pembayaran diperbarui!');
                    } else {
                        txData.createdAt = new Date().toISOString();
                        await addDoc(window.app.getDbPath('transactions'), txData);
                        showNotification('Lunas?', 'Pembayaran tercatat!');
                    }
                    
                    state.isPayDebtModalOpen = false; 
                    state.editingTxId = null; 
                } catch (err) { 
                    console.error("Error", err); 
                    showNotification('Gagal', 'Coba lagi', 'error'); 
                } finally { 
                    state.isSubmitting = false; 
                    render(); 
                } 
            },

        window.app.renderDebtsGrouped = function() { 
             const { debts } = state.data; const grouped = {}; 
             let globalPayable = 0;
             let globalReceivable = 0;

             debts.forEach(debt => { 
                 const rawName = debt.person.trim(); 
                 const personKey = rawName.toLowerCase(); 
                 if (!grouped[personKey]) { 
                     grouped[personKey] = { name: rawName, items: [], totalPayable: 0, totalReceivable: 0, originalPayable: 0, originalReceivable: 0 }; 
                 } 
                 grouped[personKey].items.push(debt); 
                 
                 // Kalkulasi sisa & original amount untuk progress bar
                 const remaining = debt.amount - (debt.paidAmount || 0); 
                 
                 if (debt.type === 'payable') {
                     grouped[personKey].originalPayable += debt.amount;
                     if (remaining > 0) {
                         grouped[personKey].totalPayable += remaining; 
                         globalPayable += remaining;
                     }
                 } else {
                     grouped[personKey].originalReceivable += debt.amount;
                     if (remaining > 0) {
                         grouped[personKey].totalReceivable += remaining; 
                         globalReceivable += remaining;
                     }
                 }
             });
            const groupedList = Object.values(grouped).sort((a, b) => a.name.localeCompare(b.name));
            
            return `
            <div class="space-y-6 animate-pop-in">
                <!-- Header Summary Cards -->

                            <h3 class="text-3xl font-black tracking-tight">${formatRupiah(globalPayable)}</h3>

                            <h3 class="text-3xl font-black tracking-tight">${formatRupiah(globalReceivable)}</h3>

                        <i data-lucide="plus" width="16"></i> Catat Baru
                    </button>
                </div>

                <!-- People List Cards -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                    ${groupedList.length === 0 ? `<div class="col-span-full py-12 text-center text-slate-400 border-2 border-dashed border-slate-200 rounded-[2rem]"><p class="font-bold">Belum ada catatan hutang.</p><p class="text-xs mt-1">Aman, hidup tenang tanpa hutang!</p></div>` : ''}
                    
                    ${groupedList.map(group => {
                        const safeName = group.name.replace(/'/g, "\\'"); 
                        const safeId = group.name.replace(/[^a-zA-Z0-9]/g, '_'); 
                        const isExpanded = state.expandedPerson === group.name;
                        
                        // Logika Tampilan Utama
                        let statusColor = 'bg-slate-100 text-slate-500';
                        let statusText = 'Lunas';
                        let mainAmount = 0;
                        let progress = 0;
                        let showPayButton = false;
                        let payType = '';
                        
                        if (group.totalPayable > 0 && group.totalReceivable > 0) {
                             statusColor = 'bg-orange-100 text-orange-600'; statusText = 'Campur';
                             // Prioritas tampilan tombol jika campur: Tampilkan yang lebih besar nominalnya
                             if (group.totalPayable >= group.totalReceivable) {
                                 showPayButton = true; payType = 'payable'; mainAmount = group.totalPayable;
                                 progress = group.originalPayable > 0 ? ((group.originalPayable - group.totalPayable) / group.originalPayable) * 100 : 100;

                             progress = group.originalReceivable > 0 ? ((group.originalReceivable - group.totalReceivable) / group.originalReceivable) * 100 : 100;
                        } else {
                            progress = 100; // Lunas
                        }

                        return `

                                         </div>
                                         <div class="min-w-0">
                                            <h4 class="font-bold text-base text-slate-800 truncate pr-2">${group.name}</h4>
                                            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider flex items-center gap-1"><i data-lucide="file-text" width="10"></i> ${group.items.length} Catatan</p>
                                         </div>
                                    </div>
                                    <div class="text-right flex-shrink-0">
                                        <span class="block font-black text-sm text-slate-700">${mainAmount > 0 ? formatRupiah(mainAmount) : (group.totalPayable > 0 || group.totalReceivable > 0 ? '...' : 'Lunas')}</span>
                                        <span class="inline-block px-2 py-0.5 rounded-md text-[9px] font-bold ${statusColor} mt-0.5">${statusText}</span>
                                    </div>
                                </div>

                                <!-- Progress Bar -->
                                <div class="w-full bg-slate-100 h-2 rounded-full mt-2 overflow-hidden flex">
                                    <div class="h-full rounded-full transition-all duration-1000 ${payType === 'payable' ? 'bg-rose-500' : 'bg-emerald-500'}" style="width: ${progress}%"></div>
                                </div>
                                <div class="flex justify-between mt-1">
                                    <span class="text-[9px] font-bold text-slate-400">Terbayar</span>
                                    <span class="text-[9px] font-bold ${payType === 'payable' ? 'text-rose-500' : 'text-emerald-500'}">${Math.round(progress)}%</span>
                                </div>

                                <!-- Main Actions -->
                                <div class="flex gap-2 mt-4">
                                    ${showPayButton ? `
                                        <button onclick="app.openPayDebtModal('${safeName}', '${payType}', ${mainAmount})" class="flex-1 py-2 rounded-xl text-xs font-bold text-white shadow-md transition-all active:scale-95 ${payType === 'payable' ? 'bg-slate-800 hover:bg-slate-900' : 'bg-emerald-600 hover:bg-emerald-700'}">
                                            ${payType === 'payable' ? 'Bayar Hutang' : 'Terima Piutang'}
                                        </button>
                                    ` : ''}
                                    <button onclick="app.toggleExpandPerson('${safeName}')" class="px-3 py-2 rounded-xl bg-slate-100 text-slate-500 hover:bg-slate-200 transition-colors">
                                        <i data-lucide="chevron-down" width="16" class="transform transition-transform duration-300 ${isExpanded ? 'rotate-180' : ''}"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <div id="details-${safeId}" class="bg-slate-50 border-t border-slate-100 transition-all duration-300 grid ${isExpanded ? 'grid-rows-1' : 'grid-rows-0'}">
                                <div class="overflow-hidden px-4">
                                    <div class="py-4 space-y-3">
                                        ${group.items.map(item => {
                                            const remaining = item.amount - (item.paidAmount||0); 
                                            const isPaid = remaining <= 0; 
                                            const isPayable = item.type === 'payable';
                                            
                                            return `
                                            <div class="bg-white p-3.5 rounded-xl border border-slate-100 shadow-sm relative flex flex-col gap-2">
                                                <div class="flex justify-between items-start">
                                                    <div>
                                                        <span class="text-[9px] font-black px-1.5 py-0.5 rounded ${isPayable?'bg-rose-50 text-rose-500':'bg-emerald-50 text-emerald-500'} mb-1 inline-block tracking-wide border ${isPayable?'border-rose-100':'border-emerald-100'}">${isPayable?'HUTANG':'PIUTANG'}</span>
                                                        <p class="text-[10px] text-slate-400 font-bold mt-0.5 flex items-center gap-1"><i data-lucide="calendar" width="10"></i> ${formatDate(item.date)}</p>
                                                    </div>
                                                    ${isPaid ? `<div class="px-2 py-1 rounded-lg bg-emerald-50 text-emerald-600 text-[9px] font-bold border border-emerald-100 flex items-center gap-1"><i data-lucide="check-circle" width="10"></i> Lunas</div>` : ''}
                                                </div>
                                                
                                                <div class="bg-slate-50 p-2 rounded-lg border border-slate-100">
                                                    <p class="text-xs font-bold text-slate-600 line-clamp-2 italic">"${item.notes||'...'}"</p>
                                                </div>
                                                
                                                <div class="mt-1 flex justify-between items-end">
                                                    <div>
                                                        <p class="text-[9px] text-slate-400 font-bold">Total Awal</p>
                                                        <p class="font-bold text-slate-600 text-xs">${formatRupiah(item.amount)}</p>
                                                    </div>
                                                    <div class="text-right">
                                                        <p class="text-[9px] text-slate-400 font-bold">Sisa Tagihan</p>
                                                        <p class="font-black ${isPayable ? 'text-rose-500' : 'text-emerald-500'} text-sm">${formatRupiah(remaining)}</p>
                                                    </div>
                                                </div>
                                                <button onclick="app.deleteDebt('${item.id}')" class="absolute -right-2 -top-2 w-6 h-6 bg-white text-slate-300 hover:text-rose-500 border border-slate-100 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity shadow-sm z-20" title="Hapus"><i data-lucide="trash-2" width="12"></i></button>
                                            </div>`;
                                        }).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>`;
                    }).join('')}
                </div>
            </div>`;
        };

        window.app.renderAllModals = function() {
            if (state.isSubmitting) return renderModalLoading();
            if (state.isSettingsModalOpen) return window.app.renderSettingsModalOriginalHTML();
            if (state.isTransactionModalOpen) return window.app.renderTxModalOriginalHTML();
            if (state.isTransferModalOpen) return window.app.renderTransferModalOriginalHTML();
            if (state.isDebtModalOpen) return window.app.renderDebtModalOriginalHTML();
            if (state.isPayDebtModalOpen) return window.app.renderPayDebtModalOriginalHTML();
            return '';
        };

        render();
    </script>
</body>
</html>
