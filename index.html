<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyKeuangan - Pencatatan Keuangan</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .animate-scale-in { animation: scaleIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        /* Accordion Animation Classes */
        .grid-rows-0 { grid-template-rows: 0fr; }
        .grid-rows-1 { grid-template-rows: 1fr; }
        
        /* Dynamic Island Styles */
        .dynamic-island {
            position: fixed;
            top: 1.5rem;
            left: 50%;
            transform: translateX(-50%) translateY(-150%);
            background: rgba(15, 23, 42, 0.9); /* Darker background */
            backdrop-filter: blur(16px);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 100;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: auto;
            max-width: 90%;
            opacity: 0;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .dynamic-island.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Checkbox Custom */
        .checkbox-wrapper input:checked + div { background-color: #2563eb; border-color: #2563eb; }
        .checkbox-wrapper input:checked + div svg { display: block; }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        /* Shared Styles */
        .label-text { display: block; font-size: 0.85rem; font-weight: 700; color: #334155; margin-bottom: 0.5rem; letter-spacing: 0.01em; }
        .input-field { width: 100%; padding: 0.875rem 1rem; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 1rem; outline: none; transition: all 0.2s; font-weight: 600; color: #1e293b; }
        .input-field:focus { background: #fff; ring: 3px solid #bfdbfe; border-color: #3b82f6; box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.1); }
        .btn-primary { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); color: white; padding: 1rem; border-radius: 1rem; font-weight: 700; letter-spacing: 0.025em; transition: all 0.2s; box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.2); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.3); }
        .btn-option { padding: 0.75rem; border-radius: 0.75rem; border: 1px solid #e2e8f0; font-size: 0.875rem; font-weight: 600; color: #64748b; background: white; transition: all; }
        .btn-option:hover { background: #f8fafc; border-color: #cbd5e1; }
        .btn-option.active { background-color: #eff6ff; border-color: #3b82f6; color: #1d4ed8; box-shadow: 0 2px 4px rgba(59, 130, 246, 0.1); }
        .currency-prefix { position: absolute; left: 1.25rem; top: 0.875rem; color: #94a3b8; font-weight: 700; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-slate-800 h-screen overflow-hidden flex flex-col bg-[#f8fafc]">

    <div id="app" class="flex flex-col h-full w-full">
        <!-- Initial Loader -->
        <div class="m-auto text-center">
            <div class="relative w-16 h-16 mx-auto mb-4">
                <div class="absolute inset-0 border-4 border-blue-100 rounded-full"></div>
                <div class="absolute inset-0 border-4 border-blue-600 rounded-full border-t-transparent animate-spin"></div>
            </div>
            <p class="text-slate-500 font-bold tracking-tight">Memuat...</p>
        </div>
    </div>

    <!-- Dynamic Island Element -->
    <div id="dynamic-island" class="dynamic-island">
        <div id="island-icon"></div>
        <div class="flex flex-col">
            <span id="island-title" class="text-sm font-bold leading-tight">Notifikasi</span>
            <span id="island-message" class="text-xs text-slate-300 leading-tight">Pesan disini</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDXOfZbVDqtfGB0abQkTeILo-XC6a9xxKI",
            authDomain: "hub-dashboard-92428.firebaseapp.com",
            projectId: "hub-dashboard-92428",
            storageBucket: "hub-dashboard-92428.firebasestorage.app",
            messagingSenderId: "827243064075",
            appId: "1:827243064075:web:21b8e40b88f13b2433d00e"
        };

        const appFirebase = initializeApp(firebaseConfig);
        const auth = getAuth(appFirebase);
        const db = getFirestore(appFirebase);
        const appId = 'my-finance-app-v1'; 

        const colorOptions = ['bg-red-500', 'bg-orange-500', 'bg-amber-500', 'bg-yellow-500', 'bg-lime-500', 'bg-green-500', 'bg-emerald-500', 'bg-teal-500', 'bg-cyan-500', 'bg-sky-500', 'bg-blue-500', 'bg-indigo-500', 'bg-violet-500', 'bg-purple-500', 'bg-fuchsia-500', 'bg-pink-500', 'bg-rose-500', 'bg-slate-500'];
        const iconOptions = ['more-horizontal', 'wallet', 'banknote', 'credit-card', 'coins', 'piggy-bank', 'landmark', 'dollar-sign', 'shopping-bag', 'shopping-cart', 'utensils', 'coffee', 'beer', 'cigarette', 'car', 'bus', 'train', 'plane', 'fuel', 'map-pin', 'home', 'zap', 'droplet', 'wifi', 'phone', 'tv', 'hammer', 'wrench', 'shirt', 'scissors', 'heart-pulse', 'pill', 'baby', 'graduation-cap', 'book', 'gamepad-2', 'music', 'clapperboard', 'ticket', 'gift', 'briefcase', 'trending-up', 'percent', 'award'];

        // Date functions
        const toLocalISO = (date) => {
            const offset = date.getTimezoneOffset() * 60000;
            return new Date(date.getTime() - offset).toISOString().split('T')[0];
        };
        const getToday = () => toLocalISO(new Date());
        const getFirstDayOfMonth = () => { const d = new Date(); d.setDate(1); return toLocalISO(d); };
        const getLastDayOfMonth = () => { const d = new Date(); d.setMonth(d.getMonth() + 1); d.setDate(0); return toLocalISO(d); };

        // --- GLOBAL STATE ---
        const state = {
            user: null, 
            accessCode: localStorage.getItem('finance_access_code') || null, 
            isLoading: true, 
            activeMenu: 'dashboard', 
            settingsTab: 'expense',
            
            // Render Control
            shouldRefreshContent: true,
            lastRenderedMenu: null,
            
            // Modals
            isSettingsModalOpen: false, isTransactionModalOpen: false, isTransferModalOpen: false, isDebtModalOpen: false, isPayDebtModalOpen: false,
            
            // New UI State
            confirmModal: { isOpen: false, title: '', message: '', onConfirm: null, type: 'danger' },
            notification: { show: false, title: '', message: '', type: 'success', timeout: null },

            editingItem: null, selectedDebt: null,
            loginCodeInput: '',
            expandedPerson: null, // Keep track but don't depend on it for render

            filter: { type: 'all', startDate: getFirstDayOfMonth(), endDate: getLastDayOfMonth() },
            dashboardFilter: { type: 'all', walletId: 'all', startDate: getFirstDayOfMonth(), endDate: getLastDayOfMonth(), periodMode: 'monthly' },

            settingsForm: { name: '', budget: '', initialBalance: '', type: 'Cash', icon: 'more-horizontal', color: 'bg-slate-500' },
            txForm: { type: 'expense', date: getToday(), amount: '', walletId: '', categoryId: '', notes: '' },
            transferForm: { date: getToday(), amount: '', fromWalletId: '', toWalletId: '', notes: '' },
            debtForm: { type: 'payable', person: '', amount: '', date: getToday(), dueDate: '', notes: '', isOldDebt: false },
            payDebtForm: { date: getToday(), amount: '', walletId: '', notes: '' },

            data: { expense: [], income: [], wallets: [], transactions: [], debts: [] },
            unsubscribeListeners: []
        };

        const formatNumberString = (numStr) => { const num = numStr.replace(/\D/g, ''); return num ? new Intl.NumberFormat('id-ID').format(num) : ''; };
        const formatRupiah = (number) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
        const formatDate = (dateString) => { if (!dateString) return '-'; return new Date(dateString).toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }); };
        const getCollectionName = (tab) => { if (tab === 'expense') return 'expense_categories'; if (tab === 'income') return 'income_categories'; if (tab === 'wallets') return 'wallets'; if (tab === 'transactions') return 'transactions'; if (tab === 'debts') return 'debts'; return 'unknown'; };

        // --- NEW UI HELPER FUNCTIONS ---
        
        function showNotification(title, message, type = 'success') {
            const island = document.getElementById('dynamic-island');
            const islandTitle = document.getElementById('island-title');
            const islandMsg = document.getElementById('island-message');
            const islandIcon = document.getElementById('island-icon');

            if (!island) return;

            islandTitle.innerText = title;
            islandMsg.innerText = message;
            
            let iconSvg = '';
            if (type === 'success') iconSvg = `<svg class="text-emerald-400 w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`;
            else if (type === 'error') iconSvg = `<svg class="text-rose-500 w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`;
            else iconSvg = `<svg class="text-blue-400 w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`;
            
            islandIcon.innerHTML = iconSvg;
            island.classList.add('show');

            if (state.notification.timeout) clearTimeout(state.notification.timeout);
            state.notification.timeout = setTimeout(() => {
                island.classList.remove('show');
            }, 3000);
        }

        function triggerConfirm(title, message, onConfirm, type = 'danger') {
            state.confirmModal = { isOpen: true, title, message, onConfirm, type };
            render();
        }

        function closeConfirm() {
            state.confirmModal = { isOpen: false, title: '', message: '', onConfirm: null, type: 'danger' };
            render();
        }

        function executeConfirm() {
            if (state.confirmModal.onConfirm) state.confirmModal.onConfirm();
            closeConfirm();
        }

        function updateNavbarActiveState() {
            const menuItems = ['dashboard', 'debts', 'settings'];
            menuItems.forEach(id => {
                const btn = document.getElementById(`nav-btn-${id}`);
                const icon = document.getElementById(`nav-icon-${id}`);
                if (btn && icon) {
                    if (state.activeMenu === id) {
                        btn.className = "relative px-4 py-2.5 rounded-xl text-sm font-bold transition-all duration-300 flex items-center gap-2 bg-slate-900 text-white shadow-lg shadow-slate-200 transform scale-105";
                        icon.classList.add('stroke-2');
                    } else {
                        btn.className = "relative px-4 py-2.5 rounded-xl text-sm font-semibold transition-all duration-300 flex items-center gap-2 text-slate-500 hover:text-slate-900 hover:bg-slate-100";
                        icon.classList.remove('stroke-2');
                    }
                }
            });
        }

        // --- LOGIC FUNCTIONS ---

        function cleanupListeners() {
            state.unsubscribeListeners.forEach(unsub => unsub());
            state.unsubscribeListeners = [];
            state.data = { expense: [], income: [], wallets: [], transactions: [], debts: [] };
        }

        function initDataListeners(code) {
            if (!code) return;
            cleanupListeners(); 
            const userId = `code_${code}`; 

            const refresh = () => { state.shouldRefreshContent = true; render(); };

            ['expense', 'income', 'wallets'].forEach(key => {
                const unsub = onSnapshot(query(collection(db, 'artifacts', appId, 'users', userId, getCollectionName(key))), (snapshot) => {
                    const items = []; snapshot.forEach((doc) => items.push({ id: doc.id, ...doc.data() })); state.data[key] = items; refresh();
                });
                state.unsubscribeListeners.push(unsub);
            });
            const unsubTx = onSnapshot(query(collection(db, 'artifacts', appId, 'users', userId, 'transactions')), (snapshot) => {
                const items = []; snapshot.forEach((doc) => items.push({ id: doc.id, ...doc.data() })); state.data.transactions = items.sort((a, b) => new Date(b.date) - new Date(a.date)); refresh();
            });
            state.unsubscribeListeners.push(unsubTx);

            const unsubDebt = onSnapshot(query(collection(db, 'artifacts', appId, 'users', userId, 'debts')), (snapshot) => {
                const items = []; snapshot.forEach((doc) => items.push({ id: doc.id, ...doc.data() })); state.data.debts = items.sort((a, b) => new Date(b.date) - new Date(a.date)); refresh();
            });
            state.unsubscribeListeners.push(unsubDebt);
        }

        window.app = {
            handleLoginInput: (val) => {
                state.loginCodeInput = val.toUpperCase().replace(/[^A-Z0-9]/g, '');
                const el = document.getElementById('login-input');
                if(el && el.value !== state.loginCodeInput) el.value = state.loginCodeInput;
            },
            login: (e) => {
                e.preventDefault();
                if (!state.loginCodeInput || state.loginCodeInput.length < 3) return showNotification('Error', 'Kode minimal 3 karakter', 'error');
                state.accessCode = state.loginCodeInput;
                localStorage.setItem('finance_access_code', state.accessCode);
                initDataListeners(state.accessCode);
                showNotification('Berhasil', 'Data berhasil dimuat', 'success');
                state.shouldRefreshContent = true;
                render();
            },
            logout: () => {
                triggerConfirm('Konfirmasi Keluar', 'Apakah Anda yakin ingin keluar?', () => {
                    cleanupListeners();
                    state.accessCode = null;
                    state.loginCodeInput = '';
                    localStorage.removeItem('finance_access_code');
                    state.activeMenu = 'dashboard';
                    const appDiv = document.getElementById('app');
                    appDiv.innerHTML = ''; 
                    render();
                }, 'danger');
            },
            setMenu: (menu) => { 
                if (state.activeMenu !== menu) {
                    state.activeMenu = menu; 
                    state.shouldRefreshContent = true;
                    render(); 
                }
            },
            setSettingsTab: (tab) => { state.settingsTab = tab; state.shouldRefreshContent = true; render(); },
            
            // --- FIXED TOGGLE FUNCTION (ZERO FLICKER) ---
            toggleExpandPerson: (personName) => { 
                // 1. Update State (silently, so it persists if data refreshes later)
                state.expandedPerson = state.expandedPerson === personName ? null : personName;
                
                // 2. Direct DOM Manipulation (Instant, no re-render)
                // Use a safe ID (remove spaces/special chars)
                const safeId = personName.replace(/[^a-zA-Z0-9]/g, '_');
                const detailEl = document.getElementById(`details-${safeId}`);
                const iconEl = document.getElementById(`icon-${safeId}`);
                
                if (detailEl) {
                    const isClosed = detailEl.classList.contains('grid-rows-0');
                    if (isClosed) {
                        detailEl.classList.remove('grid-rows-0');
                        detailEl.classList.add('grid-rows-1');
                        if (iconEl) iconEl.style.transform = 'rotate(180deg)';
                    } else {
                        detailEl.classList.add('grid-rows-0');
                        detailEl.classList.remove('grid-rows-1');
                        if (iconEl) iconEl.style.transform = 'rotate(0deg)';
                    }
                }
                // NOTE: No render() call here!
            },
            
            setTxFilter: (field, value) => { state.filter[field] = value; state.shouldRefreshContent = true; render(); },
            setDashboardFilter: (field, value) => {
                state.dashboardFilter[field] = value;
                if (field === 'periodMode') {
                    if (value === 'daily') { state.dashboardFilter.startDate = getToday(); state.dashboardFilter.endDate = getToday(); }
                    else if (value === 'monthly') { state.dashboardFilter.startDate = getFirstDayOfMonth(); state.dashboardFilter.endDate = getLastDayOfMonth(); }
                }
                state.shouldRefreshContent = true;
                render();
            },
            resetDashboardFilter: () => { state.dashboardFilter = { type: 'all', walletId: 'all', startDate: getFirstDayOfMonth(), endDate: getLastDayOfMonth(), periodMode: 'monthly' }; state.shouldRefreshContent = true; render(); },
            toggleWalletExclusion: async (id, isChecked) => {
                const isExcluded = !isChecked;
                try {
                    const userId = `code_${state.accessCode}`;
                    await updateDoc(doc(db, 'artifacts', appId, 'users', userId, 'wallets', id), { isExcluded: isExcluded });
                } catch (err) { console.error(err); showNotification('Error', 'Gagal update status', 'error'); }
            },
            openSettingsModal: (mode, id = null) => {
                if (mode === 'edit' && id) {
                    const item = state.data[state.settingsTab].find(i => i.id === id);
                    state.editingItem = item;
                    state.settingsForm = { name: item.name, budget: item.budget || '', initialBalance: item.initialBalance || '', type: item.type || 'Cash', icon: item.icon, color: item.color };
                } else {
                    state.editingItem = null;
                    state.settingsForm = { name: '', budget: '', initialBalance: '', type: 'Cash', icon: 'more-horizontal', color: 'bg-slate-500' };
                }
                state.isSettingsModalOpen = true; 
                state.shouldRefreshContent = false;
                render();
            },
            openTransactionModal: () => {
                const defaultWallet = state.data.wallets.length > 0 ? state.data.wallets[0].id : '';
                state.txForm = { type: 'expense', date: getToday(), amount: '', walletId: defaultWallet, categoryId: '', notes: '' };
                state.isTransactionModalOpen = true; 
                state.shouldRefreshContent = false;
                render();
            },
            openTransferModal: () => {
                const wallets = state.data.wallets;
                state.transferForm = { date: getToday(), amount: '', fromWalletId: wallets.length > 0 ? wallets[0].id : '', toWalletId: wallets.length > 1 ? wallets[1].id : '', notes: '' };
                state.isTransferModalOpen = true; 
                state.shouldRefreshContent = false;
                render();
            },
            openDebtModal: () => {
                state.debtForm = { type: 'payable', person: '', amount: '', date: getToday(), dueDate: '', notes: '', isOldDebt: false };
                state.isDebtModalOpen = true; 
                state.shouldRefreshContent = false;
                render();
            },
            openPayDebtModal: (id) => {
                const debt = state.data.debts.find(d => d.id === id);
                if (!debt) return;
                const remaining = debt.amount - (debt.paidAmount || 0);
                state.selectedDebt = debt;
                state.payDebtForm = { date: getToday(), amount: remaining, walletId: state.data.wallets[0]?.id || '', notes: '' };
                state.isPayDebtModalOpen = true; 
                state.shouldRefreshContent = false;
                render();
            },
            closeAllModals: () => {
                state.isSettingsModalOpen = false; state.isTransactionModalOpen = false; state.isTransferModalOpen = false; state.isDebtModalOpen = false; state.isPayDebtModalOpen = false;
                state.shouldRefreshContent = false;
                render();
            },
            setTxType: (type) => { state.txForm.type = type; state.txForm.categoryId = ''; render(); },
            setTxWallet: (id) => { state.txForm.walletId = id; render(); },
            selectCategory: (id) => { state.txForm.categoryId = id; render(); },
            setTransferWallet: (field, id) => { state.transferForm[field] = id; render(); },
            setDebtType: (type) => { state.debtForm.type = type; render(); },
            toggleDebtOld: (checked) => { state.debtForm.isOldDebt = checked; render(); },
            setPayDebtWallet: (id) => { state.payDebtForm.walletId = id; render(); },
            
            updateForm: (formName, field, value) => { 
                state[formName][field] = value; 
            },
            handleNumberInput: (targetObj, field, el) => {
                let rawValue = el.value.replace(/\D/g, '');
                if (rawValue.length > 1 && rawValue.startsWith('0')) rawValue = rawValue.substring(1);
                state[targetObj][field] = rawValue === '' ? '' : parseInt(rawValue, 10);
                
                const formatted = formatNumberString(rawValue);
                if (el.value !== formatted) {
                    const start = el.selectionStart;
                    const oldLen = el.value.length;
                    el.value = formatted;
                    const drift = formatted.length - oldLen;
                    const newPos = Math.max(0, start + drift);
                    if(el.setSelectionRange) el.setSelectionRange(newPos, newPos);
                }
            },
            
            getDbPath: (collectionName) => { const userId = `code_${state.accessCode}`; return collection(db, 'artifacts', appId, 'users', userId, collectionName); },
            getDocPath: (collectionName, docId) => { const userId = `code_${state.accessCode}`; return doc(db, 'artifacts', appId, 'users', userId, collectionName, docId); },
            
            submitSettings: async (e) => {
                e.preventDefault(); if (!state.accessCode) return;
                const { settingsTab, settingsForm, editingItem } = state;
                const colName = getCollectionName(settingsTab);
                const newItem = { name: settingsForm.name, icon: settingsForm.icon, color: settingsForm.color, updatedAt: new Date().toISOString() };
                if (settingsTab === 'wallets') { newItem.type = settingsForm.type; newItem.initialBalance = Number(settingsForm.initialBalance); } else { newItem.budget = Number(settingsForm.budget); }
                try {
                    if (editingItem) { await updateDoc(window.app.getDocPath(colName, editingItem.id), newItem); showNotification('Sukses', 'Data berhasil diperbarui'); } 
                    else { newItem.createdAt = new Date().toISOString(); await addDoc(window.app.getDbPath(colName), newItem); showNotification('Sukses', 'Data baru ditambahkan'); }
                    state.isSettingsModalOpen = false; render();
                } catch (err) { console.error(err); showNotification('Error', 'Gagal menyimpan data', 'error'); }
            },
            deleteSettingsItem: (id) => {
                triggerConfirm('Hapus Item?', 'Tindakan ini tidak dapat dibatalkan.', async () => {
                    try { await deleteDoc(window.app.getDocPath(getCollectionName(state.settingsTab), id)); showNotification('Dihapus', 'Data berhasil dihapus'); } catch (err) { console.error(err); }
                }, 'danger');
            },
            submitTransaction: async (e) => {
                e.preventDefault(); if (!state.accessCode) return;
                const { txForm } = state;
                if (!txForm.categoryId || !txForm.walletId || !txForm.amount) return showNotification('Peringatan', 'Data tidak lengkap', 'error');
                const newTx = { type: txForm.type, date: txForm.date, amount: Number(txForm.amount), walletId: txForm.walletId, categoryId: txForm.categoryId, notes: txForm.notes, createdAt: new Date().toISOString() };
                try { await addDoc(window.app.getDbPath('transactions'), newTx); state.isTransactionModalOpen = false; showNotification('Transaksi', 'Berhasil dicatat'); render(); } catch (err) { console.error(err); showNotification('Error', 'Gagal', 'error'); }
            },
            submitTransfer: async (e) => {
                e.preventDefault(); if (!state.accessCode) return;
                const { transferForm } = state;
                if (!transferForm.fromWalletId || !transferForm.toWalletId || !transferForm.amount) return showNotification('Peringatan', 'Data tidak lengkap', 'error');
                const newTx = { type: 'transfer', date: transferForm.date, amount: Number(transferForm.amount), fromWalletId: transferForm.fromWalletId, toWalletId: transferForm.toWalletId, notes: transferForm.notes, createdAt: new Date().toISOString() };
                try { await addDoc(window.app.getDbPath('transactions'), newTx); state.isTransferModalOpen = false; showNotification('Transfer', 'Berhasil dicatat'); render(); } catch (err) { console.error(err); showNotification('Error', 'Gagal', 'error'); }
            },
            submitDebt: async (e) => {
                e.preventDefault(); if (!state.accessCode) return;
                const { debtForm } = state;
                if (!debtForm.person || !debtForm.amount) return showNotification('Peringatan', 'Nama & nominal wajib', 'error');
                const newDebt = { type: debtForm.type, person: debtForm.person, amount: Number(debtForm.amount), paidAmount: 0, date: debtForm.date, dueDate: debtForm.dueDate || null, notes: debtForm.notes, isOldDebt: debtForm.isOldDebt, status: 'active', createdAt: new Date().toISOString() };

            },
            submitDebtPayment: async (e) => {
                e.preventDefault(); if (!state.accessCode) return;
                const { payDebtForm, selectedDebt } = state;
                if (!payDebtForm.amount || !payDebtForm.walletId) return showNotification('Peringatan', 'Nominal & dompet wajib', 'error');
                const paymentAmount = Number(payDebtForm.amount);
                const currentPaid = selectedDebt.paidAmount || 0;
                const newPaidTotal = currentPaid + paymentAmount;
                const remaining = selectedDebt.amount - currentPaid;
                if (paymentAmount > remaining) return showNotification('Error', `Melebihi sisa (${formatRupiah(remaining)})`, 'error');
                try {
                    await updateDoc(window.app.getDocPath('debts', selectedDebt.id), { paidAmount: newPaidTotal, status: newPaidTotal >= selectedDebt.amount ? 'paid' : 'active', updatedAt: new Date().toISOString() });
                    const isPayable = selectedDebt.type === 'payable';
                    const newTx = { type: isPayable ? 'expense' : 'income', date: payDebtForm.date, amount: paymentAmount, walletId: payDebtForm.walletId, categoryId: 'DEBT_PAYMENT', notes: `Pembayaran ${isPayable ? 'Hutang ke' : 'Piutang dari'} ${selectedDebt.person}`, createdAt: new Date().toISOString(), isDebtPayment: true, relatedDebtId: selectedDebt.id };
                    await addDoc(window.app.getDbPath('transactions'), newTx);
                    state.isPayDebtModalOpen = false; showNotification('Pembayaran', 'Berhasil dicatat'); render();
                } catch (err) { console.error("Error", err); showNotification('Error', 'Gagal memproses', 'error'); }
            },
            deleteDebt: (id) => {
                triggerConfirm('Hapus Data?', 'Data hutang ini akan dihapus permanen.', async () => {
                    try { await deleteDoc(window.app.getDocPath('debts', id)); showNotification('Dihapus', 'Data hutang dihapus'); } catch (err) { console.error(err); }
                }, 'danger');
            },
            executeConfirm, closeConfirm
        };

        window.app.renderDashboardOriginal = function() {

                if (filter.endDate && tx.date > filter.endDate) return false;
                if (filter.type !== 'all') {
                    if (filter.type === 'debt') { if (!tx.isDebtPayment) return false; }
                    else if (filter.type === 'transfer') { if (tx.type !== 'transfer') return false; }
                    else if (filter.type === 'expense') { if (tx.type !== 'expense' || tx.isDebtPayment) return false; }
                    else if (filter.type === 'income') { if (tx.type !== 'income' || tx.isDebtPayment) return false; }
                }
                if (filter.walletId !== 'all') {
                    if (tx.type === 'transfer') { if (tx.fromWalletId !== filter.walletId && tx.toWalletId !== filter.walletId) return false; }
                    else { if (tx.walletId !== filter.walletId) return false; }
                }
                return true;
            });
            let totalIncome = 0; let totalExpense = 0; const expenseByCategory = {};

            });

            const totalBudget = budgetData.reduce((sum, item) => sum + (item.budget || 0), 0); const totalBudgetSpent = budgetData.reduce((sum, item) => sum + item.spent, 0); const totalBudgetPercent = totalBudget > 0 ? (totalBudgetSpent / totalBudget) * 100 : 0;
            const topCategories = budgetData.slice(0, 5).filter(c => c.spent > 0); const topExpenses = filteredTx.filter(tx => tx.type === 'expense' && !tx.isDebtPayment).sort((a, b) => b.amount - a.amount).slice(0, 5);

        window.app.renderTransferModalOriginalHTML = function() { const {transferForm,data}=state; const displayAmount=transferForm.amount?formatNumberString(String(transferForm.amount)):''; return `<div class="fixed inset-0 z-50 flex items-center justify-center p-4"><div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="app.closeAllModals()"></div><div class="bg-white rounded-[2rem] w-full max-w-md shadow-2xl animate-scale-in relative"><div class="p-6 border-b border-slate-100 flex items-center justify-between bg-white/90 backdrop-blur rounded-t-[2rem]"><h3 class="font-extrabold text-xl text-slate-800">Transfer Aset</h3><button onclick="app.closeAllModals()" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-full transition-colors"><i data-lucide="x" width="20"></i></button></div><form onsubmit="app.submitTransfer(event)" class="p-6 space-y-6"><div><label class="label-text">Tanggal</label><input type="date" value="${transferForm.date}" onchange="app.updateForm('transferForm','date',this.value)" class="input-field"></div><div><label class="label-text mb-2">Dari (Sumber)</label><div class="grid grid-cols-2 gap-3">${data.wallets.map(w=>`<button type="button" onclick="app.setTransferWallet('fromWalletId','${w.id}')" class="p-3 rounded-xl border text-left flex items-center gap-3 transition-all ${transferForm.fromWalletId===w.id?'bg-rose-50 border-rose-500 ring-2 ring-rose-200':'bg-white border-slate-200 hover:bg-slate-50'}"><div class="w-8 h-8 rounded-lg flex items-center justify-center text-white text-xs ${w.color||'bg-slate-400'}"><i data-lucide="${w.icon||'wallet'}" width="16"></i></div><span class="text-sm font-bold truncate text-slate-700">${w.name}</span></button>`).join('')}</div></div><div class="flex justify-center -my-4 relative z-10"><div class="bg-slate-100 p-2.5 rounded-full text-slate-400 border-4 border-white"><i data-lucide="arrow-down" width="20"></i></div></div><div><label class="label-text mb-2">Ke (Tujuan)</label><div class="grid grid-cols-2 gap-3">${data.wallets.map(w=>`<button type="button" onclick="app.setTransferWallet('toWalletId','${w.id}')" class="p-3 rounded-xl border text-left flex items-center gap-3 transition-all ${transferForm.toWalletId===w.id?'bg-emerald-50 border-emerald-500 ring-2 ring-emerald-200':'bg-white border-slate-200 hover:bg-slate-50'} ${w.id===transferForm.fromWalletId?'opacity-40 cursor-not-allowed':''}" ${w.id===transferForm.fromWalletId?'disabled':''}><div class="w-8 h-8 rounded-lg flex items-center justify-center text-white text-xs ${w.color||'bg-slate-400'}"><i data-lucide="${w.icon||'wallet'}" width="16"></i></div><span class="text-sm font-bold truncate text-slate-700">${w.name}</span></button>`).join('')}</div></div><div><label class="label-text">Nominal</label><div class="relative"><span class="currency-prefix text-lg top-3">Rp</span><input type="text" inputmode="numeric" value="${displayAmount}" oninput="app.handleNumberInput('transferForm','amount',this)" class="input-field pl-12 text-2xl font-bold text-slate-800" placeholder="0"></div></div><div><label class="label-text">Catatan</label><textarea id="input-notes" rows="2" oninput="app.updateForm('transferForm','notes',this.value)" class="input-field resize-none" placeholder="Keterangan transfer...">${transferForm.notes}</textarea></div><button type="submit" class="w-full btn-primary py-4">Proses Transfer</button></form></div></div>`; };
        window.app.renderDebtModalOriginalHTML = function() { const {debtForm}=state; const isPayable=debtForm.type==='payable'; const displayAmount=debtForm.amount?formatNumberString(String(debtForm.amount)):''; return `<div class="fixed inset-0 z-50 flex items-center justify-center p-4"><div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="app.closeAllModals()"></div><div class="bg-white rounded-[2rem] w-full max-w-md shadow-2xl animate-scale-in relative"><div class="p-6 border-b border-slate-100 flex items-center justify-between"><h3 class="font-extrabold text-xl text-slate-800">Catat Hutang/Piutang</h3><button onclick="app.closeAllModals()" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-full transition-colors"><i data-lucide="x" width="20"></i></button></div><form onsubmit="app.submitDebt(event)" class="p-6 space-y-5"><div class="bg-slate-100 p-1.5 rounded-2xl flex"><button type="button" onclick="app.setDebtType('payable')" class="flex-1 py-3 rounded-xl text-sm font-bold transition-all ${isPayable?'bg-white text-rose-600 shadow-md':'text-slate-500 hover:text-slate-700'}">Hutang (Saya)</button><button type="button" onclick="app.setDebtType('receivable')" class="flex-1 py-3 rounded-xl text-sm font-bold transition-all ${!isPayable?'bg-white text-emerald-600 shadow-md':'text-slate-500 hover:text-slate-700'}">Piutang (Orang)</button></div><div><label class="label-text">Nama Pihak/Orang</label><div class="relative"><div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400"><i data-lucide="user" width="18"></i></div><input required type="text" id="input-person" value="${debtForm.person}" oninput="app.updateForm('debtForm','person',this.value)" class="input-field pl-12" placeholder="Nama orang..."></div></div><div><label class="label-text">Nominal</label><div class="relative"><span class="currency-prefix text-lg top-3">Rp</span><input type="text" inputmode="numeric" value="${displayAmount}" oninput="app.handleNumberInput('debtForm','amount',this)" class="input-field pl-12 text-2xl font-bold ${isPayable?'text-rose-600':'text-emerald-600'}" placeholder="0"></div></div><div class="grid grid-cols-2 gap-4"><div><label class="label-text">Tanggal</label><input type="date" value="${debtForm.date}" onchange="app.updateForm('debtForm','date',this.value)" class="input-field"></div><div><label class="label-text">Jatuh Tempo</label><input type="date" value="${debtForm.dueDate}" onchange="app.updateForm('debtForm','dueDate',this.value)" class="input-field"></div></div><div class="flex items-center gap-3 bg-amber-50 p-4 rounded-xl border border-amber-100 checkbox-wrapper cursor-pointer hover:bg-amber-100/50 transition-colors" onclick="document.getElementById('input-old-debt').click()"><input type="checkbox" id="input-old-debt" onchange="app.toggleDebtOld(this.checked)" class="hidden" ${debtForm.isOldDebt?'checked':''}><div class="w-6 h-6 bg-white border-2 border-slate-300 rounded-lg flex items-center justify-center transition-colors shadow-sm"><svg class="hidden w-4 h-4 text-white fill-current" viewBox="0 0 20 20"><path d="M0 11l2-2 5 5L18 3l2 2L7 18z"/></svg></div><div class="flex-1"><span class="block text-sm font-bold text-slate-800">Catatan Lama</span><span class="block text-xs text-slate-500 font-medium mt-0.5">Saldo dompet tidak akan berubah.</span></div></div><div><label class="label-text">Catatan</label><textarea id="input-notes" rows="2" oninput="app.updateForm('debtForm','notes',this.value)" class="input-field resize-none" placeholder="Keterangan tambahan...">${debtForm.notes}</textarea></div><button type="submit" class="w-full btn-primary py-4">Simpan Catatan</button></form></div></div>`; };
        window.app.renderPayDebtModalOriginalHTML = function() { const { payDebtForm, data, selectedDebt } = state; const isPayable = selectedDebt.type === 'payable'; const displayAmount = payDebtForm.amount ? formatNumberString(String(payDebtForm.amount)) : ''; const title = isPayable ? `Bayar Hutang` : `Terima Piutang`; const personName = selectedDebt.person; const remaining = selectedDebt.amount - (selectedDebt.paidAmount || 0); return `<div class="fixed inset-0 z-50 flex items-center justify-center p-4"><div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="app.closeAllModals()"></div><div class="bg-white rounded-[2rem] w-full max-w-md shadow-2xl animate-scale-in relative"><div class="p-6 border-b border-slate-100 flex items-center justify-between"><h3 class="font-extrabold text-xl text-slate-800">${title}</h3><button onclick="app.closeAllModals()" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-full transition-colors"><i data-lucide="x" width="20"></i></button></div><form onsubmit="app.submitDebtPayment(event)" class="p-6 space-y-6"><div class="bg-blue-50 p-4 rounded-2xl text-sm text-blue-900 border border-blue-100 shadow-sm"><p class="text-center font-bold text-lg mb-4 text-blue-700">${personName}</p><div class="flex justify-between mb-1"><span>Total Tagihan:</span> <span class="font-bold">${formatRupiah(selectedDebt.amount)}</span></div><div class="flex justify-between mb-2"><span>Sudah Lunas:</span> <span class="font-bold text-emerald-600">${formatRupiah(selectedDebt.paidAmount || 0)}</span></div><div class="flex justify-between border-t border-blue-200 mt-2 pt-2"><span class="font-extrabold text-lg">Sisa:</span> <span class="font-extrabold text-lg text-rose-600">${formatRupiah(remaining)}</span></div></div><div><label class="label-text">Tanggal</label><input type="date" value="${payDebtForm.date}" onchange="app.updateForm('payDebtForm', 'date', this.value)" class="input-field"></div><div><label class="label-text mb-2">${isPayable ? 'Sumber Dana' : 'Masuk ke Dompet'}</label>${data.wallets.length === 0 ? `<p class="text-sm text-rose-500">Belum ada dompet.</p>` : `<div class="grid grid-cols-2 gap-3">${data.wallets.map(w => `<button type="button" onclick="app.setPayDebtWallet('${w.id}')" class="p-3 rounded-xl border text-left flex items-center gap-3 transition-all ${payDebtForm.walletId === w.id ? 'bg-blue-50 border-blue-500 ring-2 ring-blue-200' : 'bg-white border-slate-200 hover:bg-slate-50'}"><div class="w-8 h-8 rounded-lg flex items-center justify-center text-white text-xs ${w.color || 'bg-slate-400'}"><i data-lucide="${w.icon || 'wallet'}" width="16"></i></div><span class="text-sm font-bold truncate text-slate-700">${w.name}</span></button>`).join('')}</div>`}</div><div><label class="label-text">Nominal Pembayaran</label><div class="relative"><span class="currency-prefix text-lg top-3">Rp</span><input type="text" inputmode="numeric" value="${displayAmount}" oninput="app.handleNumberInput('payDebtForm', 'amount', this)" class="input-field pl-12 text-2xl font-bold text-slate-800" placeholder="0" autofocus></div><p class="text-[10px] text-slate-400 mt-1.5 font-medium ml-1">Tidak boleh melebihi sisa tagihan.</p></div><div><label class="label-text">Catatan</label><textarea id="input-notes" rows="2" oninput="app.updateForm('payDebtForm', 'notes', this.value)" class="input-field resize-none" placeholder="Contoh: Cicilan ke-1...">${payDebtForm.notes}</textarea></div><button type="submit" class="w-full btn-primary py-4">Proses Pembayaran</button></form></div></div>`; };

        window.app.renderAllModals = function() {
            if (state.isSettingsModalOpen) return window.app.renderSettingsModalOriginalHTML();
            if (state.isTransactionModalOpen) return window.app.renderTxModalOriginalHTML();
            if (state.isTransferModalOpen) return window.app.renderTransferModalOriginalHTML();
            if (state.isDebtModalOpen) return window.app.renderDebtModalOriginalHTML();
            if (state.isPayDebtModalOpen) return window.app.renderPayDebtModalOriginalHTML();
            return '';
        };

        render();
    </script>
