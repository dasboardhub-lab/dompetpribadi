<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyKeuangan - Pro</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; } /* Slate-50 background */
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Animations */
        .animate-spin-slow { animation: spin 3s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .scale-in { animation: scaleIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        /* Form Elements */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        /* Dynamic Island Notification */
        .dynamic-island-container {
            position: fixed;
            top: 1rem;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            z-index: 9999;
            pointer-events: none;
        }

        .dynamic-island {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: white;
            padding: 0.75rem 1.25rem;
            border-radius: 9999px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.875rem;
            font-weight: 500;
            transform: translateY(-150%) scale(0.9);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Bouncy spring effect */
            min-width: 300px;
            max-width: 90%;
            justify-content: center;
        }

        .dynamic-island.show {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        .dynamic-island-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 1.5rem;
            height: 1.5rem;
            border-radius: 50%;
        }

        .success-icon { background: #22c55e; color: white; }
        .error-icon { background: #ef4444; color: white; }
        .info-icon { background: #3b82f6; color: white; }

        /* Glass Navbar */
        .glass-nav {
            background-color: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.6);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen overflow-hidden flex flex-col">

    <!-- Notification Container -->
    <div class="dynamic-island-container">
        <div id="dynamic-island" class="dynamic-island">
            <div id="island-icon" class="dynamic-island-icon success-icon">
                <i data-lucide="check" width="14"></i>
            </div>
            <span id="island-message">Berhasil disimpan</span>
        </div>
    </div>

    <div id="app" class="flex-1 flex flex-col h-full overflow-hidden">
        <!-- Initial Loader -->
        <div class="m-auto text-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-slate-800 mx-auto mb-4"></div>
            <p class="text-slate-500 font-medium text-sm tracking-wide">Memuat aplikasi...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDXOfZbVDqtfGB0abQkTeILo-XC6a9xxKI",
            authDomain: "hub-dashboard-92428.firebaseapp.com",
            projectId: "hub-dashboard-92428",
            storageBucket: "hub-dashboard-92428.firebasestorage.app",
            messagingSenderId: "827243064075",
            appId: "1:827243064075:web:21b8e40b88f13b2433d00e"
        };

        const appFirebase = initializeApp(firebaseConfig);
        const auth = getAuth(appFirebase);
        const db = getFirestore(appFirebase);
        const appId = 'my-finance-app-v1'; 

        const colorOptions = ['bg-red-500', 'bg-orange-500', 'bg-amber-500', 'bg-yellow-500', 'bg-lime-500', 'bg-green-500', 'bg-emerald-500', 'bg-teal-500', 'bg-cyan-500', 'bg-sky-500', 'bg-blue-500', 'bg-indigo-500', 'bg-violet-500', 'bg-purple-500', 'bg-fuchsia-500', 'bg-pink-500', 'bg-rose-500', 'bg-slate-500'];
        const iconOptions = ['more-horizontal', 'wallet', 'banknote', 'credit-card', 'coins', 'piggy-bank', 'landmark', 'dollar-sign', 'shopping-bag', 'shopping-cart', 'utensils', 'coffee', 'beer', 'cigarette', 'car', 'bus', 'train', 'plane', 'fuel', 'map-pin', 'home', 'zap', 'droplet', 'wifi', 'phone', 'tv', 'hammer', 'wrench', 'shirt', 'scissors', 'heart-pulse', 'pill', 'baby', 'graduation-cap', 'book', 'gamepad-2', 'music', 'clapperboard', 'ticket', 'gift', 'briefcase', 'trending-up', 'percent', 'award'];

        const getToday = () => new Date().toISOString().split('T')[0];
        const getFirstDayOfMonth = () => new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().split('T')[0];
        const getLastDayOfMonth = () => new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).toISOString().split('T')[0];

        const state = {
            user: null, 
            accessCode: localStorage.getItem('finance_access_code') || null, 
            isLoading: true, 
            activeMenu: 'dashboard', 
            settingsTab: 'expense', 
            
            isSettingsModalOpen: false, isTransactionModalOpen: false, isTransferModalOpen: false, isDebtModalOpen: false, isPayDebtModalOpen: false,
            editingItem: null, selectedDebt: null, editingTransaction: null,
            
            loginCodeInput: '',
            expandedPerson: null,

            // Filter Transactions
            filter: {
                type: 'all', 
                startDate: getFirstDayOfMonth(),
                endDate: getLastDayOfMonth()
            },

            // Filter Dashboard
            dashboardFilter: {
                type: 'all', // all, expense, income, debt, transfer
                walletId: 'all',
                startDate: getFirstDayOfMonth(),
                endDate: getLastDayOfMonth(),
                periodMode: 'monthly' // monthly, daily, custom
            },

            settingsForm: { name: '', budget: '', initialBalance: '', type: 'Cash', icon: 'more-horizontal', color: 'bg-slate-500' },
            txForm: { type: 'expense', date: new Date().toISOString().split('T')[0], amount: '', walletId: '', categoryId: '', notes: '' },
            transferForm: { date: new Date().toISOString().split('T')[0], amount: '', fromWalletId: '', toWalletId: '', notes: '' },
            debtForm: { type: 'payable', person: '', amount: '', date: new Date().toISOString().split('T')[0], dueDate: '', notes: '', isOldDebt: false },
            payDebtForm: { date: new Date().toISOString().split('T')[0], amount: '', walletId: '', notes: '' },

            data: { expense: [], income: [], wallets: [], transactions: [], debts: [] },
            
            unsubscribeListeners: []
        };

        const formatNumberString = (numStr) => { const num = numStr.replace(/\D/g, ''); return num ? new Intl.NumberFormat('id-ID').format(num) : ''; };
        const formatRupiah = (number) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
        const formatDate = (dateString) => { if (!dateString) return '-'; return new Date(dateString).toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }); };
        const getCollectionName = (tab) => { if (tab === 'expense') return 'expense_categories'; if (tab === 'income') return 'income_categories'; if (tab === 'wallets') return 'wallets'; if (tab === 'transactions') return 'transactions'; if (tab === 'debts') return 'debts'; return 'unknown'; };

        function cleanupListeners() {
            state.unsubscribeListeners.forEach(unsub => unsub());
            state.unsubscribeListeners = [];
            state.data = { expense: [], income: [], wallets: [], transactions: [], debts: [] };
        }

        function initDataListeners(code) {
            if (!code) return;
            cleanupListeners(); 
            const userId = `code_${code}`; 

            ['expense', 'income', 'wallets'].forEach(key => {
                const unsub = onSnapshot(query(collection(db, 'artifacts', appId, 'users', userId, getCollectionName(key))), (snapshot) => {
                    const items = []; snapshot.forEach((doc) => items.push({ id: doc.id, ...doc.data() })); state.data[key] = items; render();
                });
                state.unsubscribeListeners.push(unsub);
            });
            const unsubTx = onSnapshot(query(collection(db, 'artifacts', appId, 'users', userId, 'transactions')), (snapshot) => {
                const items = []; snapshot.forEach((doc) => items.push({ id: doc.id, ...doc.data() })); state.data.transactions = items.sort((a, b) => new Date(b.date) - new Date(a.date)); render();
            });
            state.unsubscribeListeners.push(unsubTx);

            const unsubDebt = onSnapshot(query(collection(db, 'artifacts', appId, 'users', userId, 'debts')), (snapshot) => {
                const items = []; snapshot.forEach((doc) => items.push({ id: doc.id, ...doc.data() })); state.data.debts = items.sort((a, b) => new Date(b.date) - new Date(a.date)); render();
            });
            state.unsubscribeListeners.push(unsubDebt);
        }

        window.app = {
            // --- NOTIFICATION SYSTEM (DYNAMIC ISLAND) ---
            showNotification: (message, type = 'success') => {
                const island = document.getElementById('dynamic-island');
                const iconContainer = document.getElementById('island-icon');
                const messageEl = document.getElementById('island-message');
                
                // Set Icon & Color
                iconContainer.className = 'dynamic-island-icon ' + (type === 'success' ? 'success-icon' : type === 'error' ? 'error-icon' : 'info-icon');
                
                let iconName = type === 'success' ? 'check' : type === 'error' ? 'alert-triangle' : 'info';
                iconContainer.innerHTML = `<i data-lucide="${iconName}" width="14"></i>`;
                
                messageEl.textContent = message;
                lucide.createIcons(); // Refresh icons inside notification

                // Animate In
                island.classList.add('show');

                // Clear previous timeout if spamming clicks
                if (window.notificationTimeout) clearTimeout(window.notificationTimeout);

                // Auto Hide
                window.notificationTimeout = setTimeout(() => {
                    island.classList.remove('show');
                }, 3000);
            },

            handleLoginInput: (val) => {
                state.loginCodeInput = val.toUpperCase().replace(/[^A-Z0-9]/g, '');
                render();
                const el = document.getElementById('login-input');
                if(el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
            },
            login: (e) => {
                e.preventDefault();
                if (!state.loginCodeInput || state.loginCodeInput.length < 3) return window.app.showNotification("Kode minimal 3 karakter.", 'error');
                state.accessCode = state.loginCodeInput;
                localStorage.setItem('finance_access_code', state.accessCode);
                initDataListeners(state.accessCode);
                render();
            },
            
            logout: () => {
                if(confirm("Yakin ingin keluar?")) {
                    cleanupListeners();
                    state.accessCode = null;
                    state.loginCodeInput = '';
                    localStorage.removeItem('finance_access_code');
                    state.activeMenu = 'dashboard';
                    render();
                }
            },

            setMenu: (menu) => { state.activeMenu = menu; render(); },
            setSettingsTab: (tab) => { state.settingsTab = tab; render(); },

            toggleExpandPerson: (personName) => {
                state.expandedPerson = state.expandedPerson === personName ? null : personName;
                render();
            },
            
            // --- Dashboard Filter Logic ---
            setDashboardFilter: (field, value) => {
                state.dashboardFilter[field] = value;
                if (field === 'periodMode') {
                    if (value === 'daily') {
                        state.dashboardFilter.startDate = getToday();
                        state.dashboardFilter.endDate = getToday();
                    } else if (value === 'monthly') {
                        state.dashboardFilter.startDate = getFirstDayOfMonth();
                        state.dashboardFilter.endDate = getLastDayOfMonth();
                    }
                }
                render();
            },
            resetDashboardFilter: () => {
                state.dashboardFilter = { type: 'all', walletId: 'all', startDate: getFirstDayOfMonth(), endDate: getLastDayOfMonth(), periodMode: 'monthly' };
                render();
            },
            toggleWalletExclusion: async (id, isChecked) => {
                const isExcluded = !isChecked;
                try {
                    const userId = `code_${state.accessCode}`;
                    await updateDoc(doc(db, 'artifacts', appId, 'users', userId, 'wallets', id), { isExcluded: isExcluded });
                } catch (err) { console.error(err); window.app.showNotification('Gagal mengupdate.', 'error'); }
            },

            openSettingsModal: (mode, id = null) => {
                if (mode === 'edit' && id) {
                    const item = state.data[state.settingsTab].find(i => i.id === id);
                    state.editingItem = item;
                    state.settingsForm = { name: item.name, budget: item.budget || '', initialBalance: item.initialBalance || '', type: item.type || 'Cash', icon: item.icon, color: item.color };
                } else {
                    state.editingItem = null;
                    state.settingsForm = { name: '', budget: '', initialBalance: '', type: 'Cash', icon: 'more-horizontal', color: 'bg-slate-500' };
                }
                state.isSettingsModalOpen = true; render();
            },
            
            openTransactionModal: (id = null) => {
                const defaultWallet = state.data.wallets.length > 0 ? state.data.wallets[0].id : '';
                if (id) {
                    const tx = state.data.transactions.find(t => t.id === id);
                    if (tx) {
                        state.editingTransaction = tx;
                        state.txForm = { 
                            type: tx.type, 
                            date: tx.date, 
                            amount: tx.amount, 
                            walletId: tx.walletId, 
                            categoryId: tx.categoryId, 
                            notes: tx.notes 
                        };
                    }
                } else {
                    state.editingTransaction = null;
                    state.txForm = { type: 'expense', date: new Date().toISOString().split('T')[0], amount: '', walletId: defaultWallet, categoryId: '', notes: '' };
                }
                state.isTransactionModalOpen = true; render();
            },
            
            deleteTransaction: async (id) => {
                if(!confirm("Hapus transaksi ini?")) return;
                try {
                    await deleteDoc(window.app.getDocPath('transactions', id));
                    window.app.showNotification("Transaksi dihapus.", 'success');
                    render();
                } catch(err) { console.error(err); window.app.showNotification("Gagal menghapus.", 'error'); }
            },

            openTransferModal: () => {
                const wallets = state.data.wallets;
                state.transferForm = { date: new Date().toISOString().split('T')[0], amount: '', fromWalletId: wallets.length > 0 ? wallets[0].id : '', toWalletId: wallets.length > 1 ? wallets[1].id : '', notes: '' };
                state.isTransferModalOpen = true; render();
            },
            openDebtModal: () => {
                state.debtForm = { type: 'payable', person: '', amount: '', date: new Date().toISOString().split('T')[0], dueDate: '', notes: '', isOldDebt: false };
                state.isDebtModalOpen = true; render();
            },
            openPayDebtModal: (id) => {
                const debt = state.data.debts.find(d => d.id === id);
                if (!debt) return;
                const defaultWallet = state.data.wallets.length > 0 ? state.data.wallets[0].id : '';
                const remaining = debt.amount - (debt.paidAmount || 0);
                state.selectedDebt = debt;
                state.payDebtForm = { date: new Date().toISOString().split('T')[0], amount: remaining, walletId: defaultWallet, notes: '' };
                state.isPayDebtModalOpen = true; render();
            },

            closeAllModals: () => {
                state.isSettingsModalOpen = false; state.isTransactionModalOpen = false; state.isTransferModalOpen = false; state.isDebtModalOpen = false; state.isPayDebtModalOpen = false;
                render();
            },

            setTxType: (type) => { state.txForm.type = type; state.txForm.categoryId = ''; render(); },
            setTxWallet: (id) => { state.txForm.walletId = id; render(); },
            selectCategory: (id) => { state.txForm.categoryId = id; render(); },
            setTransferWallet: (field, id) => { state.transferForm[field] = id; render(); },
            setDebtType: (type) => { state.debtForm.type = type; render(); },
            toggleDebtOld: (checked) => { state.debtForm.isOldDebt = checked; render(); },
            setPayDebtWallet: (id) => { state.payDebtForm.walletId = id; render(); },

            updateForm: (formName, field, value) => {
                state[formName][field] = value; render();
                const el = document.getElementById(`input-${field}`);
                if(el && document.activeElement !== el) { el.focus(); if(el.setSelectionRange) { const len = el.value.length; el.setSelectionRange(len, len); } }
            },

            handleNumberInput: (targetObj, field, el) => {
                const rawValue = el.value.replace(/\D/g, '');
                state[targetObj][field] = rawValue === '' ? '' : parseInt(rawValue, 10);
                el.value = formatNumberString(rawValue);
            },

            // --- Database Helpers ---
            getDbPath: (collectionName) => { const userId = `code_${state.accessCode}`; return collection(db, 'artifacts', appId, 'users', userId, collectionName); },
            getDocPath: (collectionName, docId) => { const userId = `code_${state.accessCode}`; return doc(db, 'artifacts', appId, 'users', userId, collectionName, docId); },

            submitSettings: async (e) => {
                e.preventDefault(); if (!state.accessCode) return;
                const { settingsTab, settingsForm, editingItem } = state;
                const colName = getCollectionName(settingsTab);
                const newItem = { name: settingsForm.name, icon: settingsForm.icon, color: settingsForm.color, updatedAt: new Date().toISOString() };
                if (settingsTab === 'wallets') { newItem.type = settingsForm.type; newItem.initialBalance = Number(settingsForm.initialBalance); } else { newItem.budget = Number(settingsForm.budget); }
                try {
                    if (editingItem) await updateDoc(window.app.getDocPath(colName, editingItem.id), newItem);
                    else { newItem.createdAt = new Date().toISOString(); await addDoc(window.app.getDbPath(colName), newItem); }
                    state.isSettingsModalOpen = false; 
                    window.app.showNotification("Berhasil disimpan!", 'success');
                    render();
                } catch (err) { console.error(err); window.app.showNotification("Gagal menyimpan.", 'error'); }
            },

            deleteSettingsItem: async (id) => {
                if (!confirm('Hapus item ini?')) return;
                try { 
                    await deleteDoc(window.app.getDocPath(getCollectionName(state.settingsTab), id)); 
                    window.app.showNotification("Item dihapus.", 'success');
                } catch (err) { console.error(err); }
            },

            submitTransaction: async (e) => {
                e.preventDefault(); if (!state.accessCode) return;
                const { txForm, editingTransaction } = state;
                if (!txForm.categoryId || !txForm.walletId || !txForm.amount) return window.app.showNotification("Data belum lengkap.", 'error');
                
                const txData = { type: txForm.type, date: txForm.date, amount: Number(txForm.amount), walletId: txForm.walletId, categoryId: txForm.categoryId, notes: txForm.notes };
                
                try { 
                    if (editingTransaction) {
                         txData.updatedAt = new Date().toISOString();
                         await updateDoc(window.app.getDocPath('transactions', editingTransaction.id), txData);
                         window.app.showNotification("Transaksi diperbarui.", 'success');
                    } else {
                        txData.createdAt = new Date().toISOString();
                        await addDoc(window.app.getDbPath('transactions'), txData); 
                        // Reset Form after add only
                         const defaultWallet = state.data.wallets.length > 0 ? state.data.wallets[0].id : '';
                         state.txForm = { type: 'expense', date: new Date().toISOString().split('T')[0], amount: '', walletId: defaultWallet, categoryId: '', notes: '' };
                         window.app.showNotification("Transaksi disimpan.", 'success');
                    }
                    state.isTransactionModalOpen = false; 
                    render(); 
                } catch (err) { console.error(err); window.app.showNotification("Gagal menyimpan.", 'error'); }
            },

            submitTransfer: async (e) => {
                e.preventDefault(); if (!state.accessCode) return;
                const { transferForm } = state;
                if (!transferForm.fromWalletId || !transferForm.toWalletId || !transferForm.amount) return window.app.showNotification("Data belum lengkap.", 'error');
                const newTx = { type: 'transfer', date: transferForm.date, amount: Number(transferForm.amount), fromWalletId: transferForm.fromWalletId, toWalletId: transferForm.toWalletId, notes: transferForm.notes, createdAt: new Date().toISOString() };
                try { 
                    await addDoc(window.app.getDbPath('transactions'), newTx); 
                    // Reset Transfer form
                    const wallets = state.data.wallets;
                    state.transferForm = { date: new Date().toISOString().split('T')[0], amount: '', fromWalletId: wallets.length > 0 ? wallets[0].id : '', toWalletId: wallets.length > 1 ? wallets[1].id : '', notes: '' };
                    state.isTransferModalOpen = false;
                    window.app.showNotification("Transfer berhasil!", 'success');
                    render(); 
                } catch (err) { console.error(err); window.app.showNotification("Transfer gagal.", 'error'); }
            },

            submitDebt: async (e) => {
                e.preventDefault(); if (!state.accessCode) return;
                const { debtForm } = state;
                if (!debtForm.person || !debtForm.amount) return window.app.showNotification("Nama & nominal wajib.", 'error');
                const newDebt = {
                    type: debtForm.type, person: debtForm.person, amount: Number(debtForm.amount), paidAmount: 0,
                    date: debtForm.date, dueDate: debtForm.dueDate || null, notes: debtForm.notes,
                    isOldDebt: debtForm.isOldDebt, status: 'active', createdAt: new Date().toISOString()
                };
                try { 
                    await addDoc(window.app.getDbPath('debts'), newDebt); 
                    state.isDebtModalOpen = false; 
                    window.app.showNotification("Data tersimpan.", 'success');
                    render(); 
                } catch (err) { console.error(err); window.app.showNotification("Gagal menyimpan.", 'error'); }
            },

            submitDebtPayment: async (e) => {
                e.preventDefault();
                if (!state.accessCode) return;
                const { payDebtForm, selectedDebt } = state;
                if (!payDebtForm.amount || !payDebtForm.walletId) return window.app.showNotification("Data belum lengkap.", 'error');
                
                const paymentAmount = Number(payDebtForm.amount);
                const currentPaid = selectedDebt.paidAmount || 0;
                const newPaidTotal = currentPaid + paymentAmount;
                const remaining = selectedDebt.amount - currentPaid;

                if (paymentAmount > remaining) return window.app.showNotification(`Melebihi sisa (${formatRupiah(remaining)}).`, 'error');

                try {
                    const debtRef = window.app.getDocPath('debts', selectedDebt.id);
                    const updateData = { paidAmount: newPaidTotal, status: newPaidTotal >= selectedDebt.amount ? 'paid' : 'active', updatedAt: new Date().toISOString() };
                    await updateDoc(debtRef, updateData);

                    const isPayable = selectedDebt.type === 'payable';
                    const newTx = {
                        type: isPayable ? 'expense' : 'income',
                        date: payDebtForm.date,
                        amount: paymentAmount,
                        walletId: payDebtForm.walletId,
                        categoryId: 'DEBT_PAYMENT',
                        notes: `Pembayaran ${isPayable ? 'Hutang ke' : 'Piutang dari'} ${selectedDebt.person} ${payDebtForm.notes ? '('+payDebtForm.notes+')' : ''}`,
                        createdAt: new Date().toISOString(),
                        isDebtPayment: true,
                        relatedDebtId: selectedDebt.id
                    };
                    await addDoc(window.app.getDbPath('transactions'), newTx);
                    state.isPayDebtModalOpen = false; 
                    window.app.showNotification("Pembayaran sukses.", 'success');

                } catch (err) { console.error("Error paying debt:", err); window.app.showNotification("Gagal bayar.", 'error'); }

                } catch (err) { console.error(err); }
            }
        };

                state.isLoading = false; 
                if (state.accessCode) {

                }
                render();

        // --- DASHBOARD RENDERER (Clean & Professional) ---
        window.app.renderDashboardOriginal = function() {
            const { transactions, wallets, expense, income } = state.data;
            const filter = state.dashboardFilter;

            // 1. FILTER TRANSACTIONS
            const filteredTx = transactions.filter(tx => {
                if (filter.startDate && tx.date < filter.startDate) return false;
                if (filter.endDate && tx.date > filter.endDate) return false;
                if (filter.type !== 'all') {
                    if (filter.type === 'debt') { if (!tx.isDebtPayment) return false; }
                    else if (filter.type === 'transfer') { if (tx.type !== 'transfer') return false; }
                    else if (filter.type === 'expense') { if (tx.type !== 'expense' || tx.isDebtPayment) return false; }
                    else if (filter.type === 'income') { if (tx.type !== 'income' || tx.isDebtPayment) return false; }
                }
                if (filter.walletId !== 'all') {
                    if (tx.type === 'transfer') { if (tx.fromWalletId !== filter.walletId && tx.toWalletId !== filter.walletId) return false; }
                    else { if (tx.walletId !== filter.walletId) return false; }
                }
                return true;
            });

            // 2. ANALYTICS (KPI & CHARTS)
            let totalIncome = 0;
            let totalExpense = 0;
            const expenseByCategory = {}; 
            
            filteredTx.forEach(tx => {
                if (tx.type === 'income' && !tx.isDebtPayment) totalIncome += tx.amount;
                if (tx.type === 'expense' && !tx.isDebtPayment) {
                    totalExpense += tx.amount;
                    if (tx.categoryId) expenseByCategory[tx.categoryId] = (expenseByCategory[tx.categoryId] || 0) + tx.amount;
                }
            });

            const walletBalances = {};
            wallets.forEach(w => walletBalances[w.id] = w.initialBalance || 0);
            transactions.forEach(tx => {
                if (tx.type === 'expense') walletBalances[tx.walletId] -= tx.amount;
                if (tx.type === 'income') walletBalances[tx.walletId] += tx.amount;
                if (tx.type === 'transfer') { walletBalances[tx.fromWalletId] -= tx.amount; walletBalances[tx.toWalletId] += tx.amount; }
            });
            const totalAssets = wallets.reduce((sum, w) => sum + (w.isExcluded ? 0 : (walletBalances[w.id] || 0)), 0);

            const budgetData = expense.map(cat => {
                const spent = expenseByCategory[cat.id] || 0;
                const budget = cat.budget || 0;
                return { ...cat, spent, remaining: budget - spent, percent: budget > 0 ? (spent / budget) * 100 : 0 };
            }).sort((a, b) => b.percent - a.percent);

            const totalBudget = budgetData.reduce((sum, item) => sum + (item.budget || 0), 0);
            const totalBudgetSpent = budgetData.reduce((sum, item) => sum + item.spent, 0);
            const totalBudgetPercent = totalBudget > 0 ? (totalBudgetSpent / totalBudget) * 100 : 0;

                            <p class="text-slate-300 text-sm font-medium mb-1">Total Saldo Bersih</p>
                            <h3 class="text-3xl font-bold tracking-tight">${formatRupiah(totalAssets)}</h3>
                        </div>
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                            <div class="flex items-center gap-2 mb-1 text-emerald-600"><i data-lucide="arrow-up-right" width="18"></i><span class="text-sm font-bold uppercase tracking-wide">Pemasukan</span></div>
                            <h3 class="text-2xl font-bold text-slate-800">${formatRupiah(totalIncome)}</h3>
                        </div>
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                            <div class="flex items-center gap-2 mb-1 text-rose-600"><i data-lucide="arrow-down-left" width="18"></i><span class="text-sm font-bold uppercase tracking-wide">Pengeluaran</span></div>
                            <h3 class="text-2xl font-bold text-slate-800">${formatRupiah(totalExpense)}</h3>
                        </div>
                    </div>

                    <!-- FILTERS (FULL WIDTH) -->

                                <div class="flex flex-wrap gap-2 items-center">

                    <!-- WALLET TABLE (FULL WIDTH) -->

                    </div>

                    <!-- MAIN CONTENT: GRID -->
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
                        
                        <!-- LEFT COLUMN: TRANSACTION HISTORY (1/3) -->
                        <div class="lg:col-span-1 bg-white rounded-xl shadow-sm border border-slate-200 h-fit flex flex-col">
                            <div class="p-5 border-b border-slate-100 flex flex-col gap-4 sticky top-0 bg-white/95 backdrop-blur z-10 rounded-t-xl">
                                <div class="flex justify-between items-center">
                                    <h3 class="font-bold text-slate-800 text-lg">Riwayat Transaksi</h3>
                                </div>
                                <!-- BUTTONS -->
                                <div class="flex gap-3">
                                    <button onclick="app.openTransactionModal()" class="flex-1 bg-slate-900 hover:bg-slate-800 text-white px-4 py-2.5 rounded-lg text-xs font-bold shadow-md shadow-slate-900/10 flex items-center justify-center gap-2 transition-all active:scale-95">
                                        <i data-lucide="plus" width="16"></i> Transaksi
                                    </button>
                                    <button onclick="app.openTransferModal()" class="flex-1 bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 px-4 py-2.5 rounded-lg text-xs font-bold shadow-sm flex items-center justify-center gap-2 transition-all active:scale-95">

                            <div class="divide-y divide-slate-50 max-h-[800px] overflow-y-auto">

                                ${filteredTx.map(tx => {

                                    else {

                                                        </button>

            const grandTotalReceivable = groupedList.reduce((sum, g) => sum + g.totalReceivable, 0);
            return `<div class="space-y-6 fade-in"><div class="grid grid-cols-1 md:grid-cols-2 gap-4"><div class="bg-gradient-to-br from-rose-500 to-red-600 p-6 rounded-2xl text-white shadow-lg shadow-rose-500/20 relative overflow-hidden"><div class="relative z-10"><p class="text-rose-100 text-sm font-medium mb-1">Total Hutang Saya</p><h3 class="text-3xl font-bold">${formatRupiah(grandTotalPayable)}</h3></div><i data-lucide="arrow-up-right" class="absolute right-4 top-4 text-white/20 w-16 h-16"></i></div><div class="bg-gradient-to-br from-emerald-500 to-green-600 p-6 rounded-2xl text-white shadow-lg shadow-emerald-500/20 relative overflow-hidden"><div class="relative z-10"><p class="text-emerald-100 text-sm font-medium mb-1">Total Piutang (Uang Diluar)</p><h3 class="text-3xl font-bold">${formatRupiah(grandTotalReceivable)}</h3></div><i data-lucide="arrow-down-left" class="absolute right-4 top-4 text-white/20 w-16 h-16"></i></div></div><div class="flex justify-between items-center bg-white p-5 rounded-xl border border-slate-100 shadow-sm"><div><h2 class="text-xl font-bold text-slate-800">Daftar Orang</h2><p class="text-slate-500 text-xs">Klik nama untuk lihat detail.</p></div><button onclick="app.openDebtModal()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center gap-2 text-sm font-medium shadow-md shadow-blue-500/30 transition-transform active:scale-95"><i data-lucide="plus" width="16"></i> Catat Baru</button></div><div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">${groupedList.length === 0 ? `<div class="p-12 text-center text-slate-400 flex flex-col items-center col-span-full"><i data-lucide="users" width="48" class="mb-2 opacity-30"></i><p>Belum ada catatan.</p></div>` : ''}${groupedList.map(group => { const isExpanded = expandedPerson === group.name; const hasPayable = group.totalPayable > 0; const hasReceivable = group.totalReceivable > 0; const isPaidOff = !hasPayable && !hasReceivable; let badgeHtml = ''; if (isPaidOff) badgeHtml = `<span class="bg-slate-100 text-slate-500 text-[10px] font-bold px-2 py-1 rounded-full">LUNAS</span>`; else { if (hasPayable) badgeHtml += `<span class="bg-rose-50 text-rose-600 text-[10px] font-bold px-2 py-1 rounded-full border border-rose-100">Hutang: ${formatRupiah(group.totalPayable)}</span>`; if (hasReceivable) badgeHtml += `<span class="bg-emerald-50 text-emerald-600 text-[10px] font-bold px-2 py-1 rounded-full border border-emerald-100 ml-1">Piutang: ${formatRupiah(group.totalReceivable)}</span>`; } return `<div class="bg-white rounded-xl border border-slate-200 overflow-hidden transition-all shadow-sm hover:shadow-md"><button onclick="app.toggleExpandPerson('${group.name}')" class="w-full p-4 flex items-center justify-between text-left focus:outline-none bg-white hover:bg-slate-50 transition-colors"><div class="flex items-center gap-4"><div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-lg">${group.name.charAt(0).toUpperCase()}</div><div><h4 class="font-bold text-slate-800 text-base">${group.name}</h4><div class="flex items-center mt-1">${badgeHtml}</div></div></div><div class="text-slate-400 transform transition-transform ${isExpanded ? 'rotate-180' : ''}"><i data-lucide="chevron-down" width="20"></i></div></button>${isExpanded ? `<div class="border-t border-slate-100 bg-slate-50/50 p-2 space-y-2 fade-in">${group.items.map(item => { const isPayable = item.type === 'payable'; const paid = item.paidAmount || 0; const total = item.amount; const remaining = total - paid; const isItemPaid = remaining <= 0; return `<div class="bg-white p-3 rounded-lg border border-slate-100 shadow-sm flex flex-col gap-2"><div class="flex justify-between items-start"><div><div class="flex items-center gap-2"><span class="text-xs font-bold px-1.5 py-0.5 rounded ${isPayable ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}">${isPayable ? 'HUTANG' : 'PIUTANG'}</span><span class="text-xs text-slate-500">${formatDate(item.date)}</span>${item.isOldDebt ? `<span class="text-[10px] bg-amber-100 text-amber-800 px-1 rounded border border-amber-200">LAMA</span>` : ''}</div><p class="text-xs text-slate-600 mt-1 italic line-clamp-1">${item.notes || 'Tanpa catatan'}</p></div><div class="text-right"><p class="font-bold text-sm text-slate-800">${formatRupiah(total)}</p>${isItemPaid ? `<span class="text-[10px] text-emerald-600 font-bold flex items-center justify-end gap-1"><i data-lucide="check-circle" width="10"></i> Lunas</span>` : `<p class="text-[10px] text-slate-500">Sisa: <span class="font-semibold text-slate-800">${formatRupiah(remaining)}</span></p>`}</div></div><div class="flex items-center gap-3 mt-1 pt-2 border-t border-slate-50"><div class="flex-1 h-1.5 bg-slate-100 rounded-full overflow-hidden"><div class="h-full ${isPayable ? 'bg-rose-500' : 'bg-emerald-500'}" style="width: ${(paid/total)*100}%"></div></div><div class="flex gap-2">${!isItemPaid ? `<button onclick="app.openPayDebtModal('${item.id}')" class="px-2 py-1 bg-slate-800 text-white text-[10px] font-bold rounded hover:bg-slate-900 transition-colors">${isPayable ? 'Bayar' : 'Terima'}</button>` : ''}<button onclick="app.deleteDebt('${item.id}')" class="text-slate-400 hover:text-rose-500"><i data-lucide="trash-2" width="14"></i></button></div></div></div>`; }).join('')}</div>` : ''}</div>`; }).join('')}</div></div>`;
        };

        function renderDebts() { return window.app.renderDebtsGrouped(); }
        function renderSettings() { return window.app.renderSettingsModalOriginal(); }
        function renderModals() { return window.app.renderAllModals(); }
        function renderDashboard() { return window.app.renderDashboardOriginal(); }

        function render() {
            const appDiv = document.getElementById('app');
            if (state.isLoading) { 
                appDiv.innerHTML = `<div class="m-auto text-center"><div class="animate-spin rounded-full h-12 w-12 border-b-2 border-slate-800 mx-auto mb-4"></div><p class="text-slate-500 font-medium tracking-wide">Memuat data...</p></div>`; 
                return; 
            }

            if (!state.accessCode) {
                appDiv.innerHTML = renderLogin();
                lucide.createIcons();
                return;
            }

            let mainContent = '';
            const active = state.activeMenu;
            if (active === 'settings') mainContent = renderSettings();
            else if (active === 'debts') mainContent = renderDebts();
            else mainContent = renderDashboard(); 

            appDiv.innerHTML = `
                <style>
                    .label-text { display: block; font-size: 0.875rem; font-weight: 500; color: #475569; margin-bottom: 0.35rem; }
                    .input-field { width: 100%; padding: 0.6rem 0.85rem; border: 1px solid #e2e8f0; border-radius: 0.75rem; outline: none; transition: all; background-color: #fff; color: #1e293b; }
                    .input-field:focus { ring: 2px solid #3b82f6; border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
                    .btn-primary { background-color: #0f172a; color: white; padding: 0.6rem 1rem; border-radius: 0.75rem; font-weight: 600; transition: all; }
                    .btn-primary:hover { background-color: #1e293b; transform: translateY(-1px); }
                    .btn-primary:active { transform: translateY(0); }
                    .btn-option { padding: 0.6rem; border-radius: 0.75rem; border: 1px solid #e2e8f0; font-size: 0.875rem; font-weight: 500; color: #64748b; background: white; transition: all; }
                    .btn-option.active { background-color: #eff6ff; border-color: #3b82f6; color: #1d4ed8; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
                    .currency-prefix { position: absolute; left: 0.85rem; top: 0.6rem; color: #94a3b8; font-weight: 500; }
                    .custom-scroll::-webkit-scrollbar { width: 4px; }
                    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
                    .no-scrollbar::-webkit-scrollbar { display: none; }
                </style>
                ${renderNavbar()}
                <main class="flex-1 overflow-y-auto bg-slate-50/50">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        ${mainContent}
                    </div>
                </main>
                ${renderModals()}
            `;
            lucide.createIcons();
        }

        render();
    </script>
</body>
</html>
