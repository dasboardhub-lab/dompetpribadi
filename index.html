<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyKeuangan - Pencatatan Keuangan</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        
        /* Accordion Animation Classes */
        .grid-rows-0 { grid-template-rows: 0fr; }
        .grid-rows-1 { grid-template-rows: 1fr; }
        
        /* Dynamic Island Styles */
        .dynamic-island {
            position: fixed;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%) translateY(-150%);
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 100;
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: auto;
            max-width: 90%;
            opacity: 0;
            font-size: 0.8rem;
        }
        .dynamic-island.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Checkbox Custom */
        .checkbox-wrapper input:checked + div { background-color: #2563eb; border-color: #2563eb; }
        .checkbox-wrapper input:checked + div svg { display: block; }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        /* Compact Inputs - UPDATED SIZING */
        .label-text { display: block; font-size: 0.8rem; font-weight: 700; color: #475569; margin-bottom: 0.4rem; letter-spacing: 0.01em; }
        .input-field { width: 100%; padding: 0.8rem 1rem; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 0.75rem; outline: none; transition: all 0.2s; font-weight: 600; color: #1e293b; font-size: 0.95rem; }
        .input-field:focus { background: #fff; ring: 2px solid #bfdbfe; border-color: #3b82f6; }
        .btn-primary { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); color: white; padding: 1rem; border-radius: 0.75rem; font-weight: 700; font-size: 0.95rem; transition: all 0.2s; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 10px -3px rgba(15, 23, 42, 0.3); }
        .btn-option { padding: 0.7rem; border-radius: 0.5rem; border: 1px solid #e2e8f0; font-size: 0.85rem; font-weight: 600; color: #64748b; background: white; transition: all; }
        .btn-option:hover { background: #f8fafc; border-color: #cbd5e1; }
        .btn-option.active { background-color: #eff6ff; border-color: #3b82f6; color: #1d4ed8; }
        .currency-prefix { position: absolute; left: 1rem; top: 0.85rem; color: #94a3b8; font-weight: 700; font-size: 0.95rem; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-slate-800 h-screen overflow-hidden flex flex-col bg-[#f8fafc]">

    <div id="app" class="flex flex-col h-full w-full">
        <!-- Initial Loader -->
        <div class="m-auto text-center">
            <div class="relative w-12 h-12 mx-auto mb-3">
                <div class="absolute inset-0 border-[3px] border-blue-100 rounded-full"></div>
                <div class="absolute inset-0 border-[3px] border-blue-600 rounded-full border-t-transparent animate-spin"></div>
            </div>
            <p class="text-slate-500 text-sm font-bold tracking-tight">Memuat...</p>
        </div>
    </div>

    <!-- Dynamic Island Element -->
    <div id="dynamic-island" class="dynamic-island">
        <div id="island-icon"></div>
        <div class="flex flex-col">
            <span id="island-title" class="font-bold leading-tight">Notifikasi</span>
            <span id="island-message" class="text-[10px] text-slate-300 leading-tight">Pesan disini</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDXOfZbVDqtfGB0abQkTeILo-XC6a9xxKI",
            authDomain: "hub-dashboard-92428.firebaseapp.com",
            projectId: "hub-dashboard-92428",
            storageBucket: "hub-dashboard-92428.firebasestorage.app",
            messagingSenderId: "827243064075",
            appId: "1:827243064075:web:21b8e40b88f13b2433d00e"
        };

        const appFirebase = initializeApp(firebaseConfig);
        const auth = getAuth(appFirebase);
        const db = getFirestore(appFirebase);
        const appId = 'my-finance-app-v1'; 

        const colorOptions = ['bg-red-500', 'bg-orange-500', 'bg-amber-500', 'bg-yellow-500', 'bg-lime-500', 'bg-green-500', 'bg-emerald-500', 'bg-teal-500', 'bg-cyan-500', 'bg-sky-500', 'bg-blue-500', 'bg-indigo-500', 'bg-violet-500', 'bg-purple-500', 'bg-fuchsia-500', 'bg-pink-500', 'bg-rose-500', 'bg-slate-500'];
        const iconOptions = ['more-horizontal', 'wallet', 'banknote', 'credit-card', 'coins', 'piggy-bank', 'landmark', 'dollar-sign', 'shopping-bag', 'shopping-cart', 'utensils', 'coffee', 'beer', 'cigarette', 'car', 'bus', 'train', 'plane', 'fuel', 'map-pin', 'home', 'zap', 'droplet', 'wifi', 'phone', 'tv', 'hammer', 'wrench', 'shirt', 'scissors', 'heart-pulse', 'pill', 'baby', 'graduation-cap', 'book', 'gamepad-2', 'music', 'clapperboard', 'ticket', 'gift', 'briefcase', 'trending-up', 'percent', 'award'];

        // Date functions
        const toLocalISO = (date) => {
            const offset = date.getTimezoneOffset() * 60000;
            return new Date(date.getTime() - offset).toISOString().split('T')[0];
        };
        const getToday = () => toLocalISO(new Date());
        const getFirstDayOfMonth = () => { const d = new Date(); d.setDate(1); return toLocalISO(d); };
        const getLastDayOfMonth = () => { const d = new Date(); d.setMonth(d.getMonth() + 1); d.setDate(0); return toLocalISO(d); };

        // --- GLOBAL STATE ---
        const state = {
            user: null, 
            accessCode: localStorage.getItem('finance_access_code') || null, 
            isLoading: true, 
            activeMenu: 'dashboard', 
            settingsTab: 'expense', 
            shouldRefreshContent: true,
            lastRenderedMenu: null,
            
            // Modal States
            isSettingsModalOpen: false, isTransactionModalOpen: false, isTransferModalOpen: false, isDebtModalOpen: false, isPayDebtModalOpen: false,
            confirmModal: { isOpen: false, title: '', message: '', onConfirm: null, type: 'danger' },
            notification: { show: false, title: '', message: '', type: 'success', timeout: null },
            
            // Editing State
            editingItem: null, 
            editingTxId: null, 
            selectedDebt: null,
            
            loginCodeInput: '',
            expandedPerson: null,
            filter: { type: 'all', startDate: getFirstDayOfMonth(), endDate: getLastDayOfMonth() },
            dashboardFilter: { type: 'all', walletId: 'all', startDate: getFirstDayOfMonth(), endDate: getLastDayOfMonth(), periodMode: 'monthly' },
            
            // Forms
            settingsForm: { name: '', budget: '', initialBalance: '', type: 'Cash', icon: 'more-horizontal', color: 'bg-slate-500' },
            txForm: { type: 'expense', date: getToday(), amount: '', walletId: '', categoryId: '', notes: '' },
            transferForm: { date: getToday(), amount: '', fromWalletId: '', toWalletId: '', notes: '' },
            debtForm: { type: 'payable', person: '', amount: '', date: getToday(), dueDate: '', notes: '', isOldDebt: false, walletId: '' },
            payDebtForm: { date: getToday(), amount: '', walletId: '', notes: '' },
            
            data: { expense: [], income: [], wallets: [], transactions: [], debts: [] },
            unsubscribeListeners: []
        };

        const formatNumberString = (numStr) => { const num = numStr.replace(/\D/g, ''); return num ? new Intl.NumberFormat('id-ID').format(num) : ''; };
        const formatRupiah = (number) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
        const formatDate = (dateString) => { if (!dateString) return '-'; return new Date(dateString).toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }); };
        const getCollectionName = (tab) => { if (tab === 'expense') return 'expense_categories'; if (tab === 'income') return 'income_categories'; if (tab === 'wallets') return 'wallets'; if (tab === 'transactions') return 'transactions'; if (tab === 'debts') return 'debts'; return 'unknown'; };

        // --- HELPERS ---
        function showNotification(title, message, type = 'success') {
            const island = document.getElementById('dynamic-island');
            const islandTitle = document.getElementById('island-title');
            const islandMsg = document.getElementById('island-message');
            const islandIcon = document.getElementById('island-icon');
            if (!island) return;
            islandTitle.innerText = title;
            islandMsg.innerText = message;
            let iconSvg = '';
            if (type === 'success') iconSvg = `<svg class="text-emerald-400 w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`;
            else iconSvg = `<svg class="text-rose-500 w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`;
            islandIcon.innerHTML = iconSvg;
            island.classList.add('show');
            if (state.notification.timeout) clearTimeout(state.notification.timeout);
            state.notification.timeout = setTimeout(() => { island.classList.remove('show'); }, 3000);
        }

        function triggerConfirm(title, message, onConfirm, type = 'danger') { state.confirmModal = { isOpen: true, title, message, onConfirm, type }; render(); }
        function closeConfirm() { state.confirmModal = { isOpen: false, title: '', message: '', onConfirm: null, type: 'danger' }; render(); }
        function executeConfirm() { if (state.confirmModal.onConfirm) state.confirmModal.onConfirm(); closeConfirm(); }

        function updateNavbarActiveState() {
            ['dashboard', 'debts', 'settings'].forEach(id => {
                const btn = document.getElementById(`nav-btn-${id}`);
                const icon = document.getElementById(`nav-icon-${id}`);
                if (btn && icon) {
                    if (state.activeMenu === id) {
                        btn.className = "relative px-3 py-2 rounded-lg text-xs font-bold transition-all duration-300 flex items-center gap-2 bg-slate-900 text-white shadow-md transform scale-105";
                        icon.classList.add('stroke-2');
                    } else {
                        btn.className = "relative px-3 py-2 rounded-lg text-xs font-semibold transition-all duration-300 flex items-center gap-2 text-slate-500 hover:text-slate-900 hover:bg-slate-100";
                        icon.classList.remove('stroke-2');
                    }
                }
            });
        }

        function cleanupListeners() { state.unsubscribeListeners.forEach(unsub => unsub()); state.unsubscribeListeners = []; state.data = { expense: [], income: [], wallets: [], transactions: [], debts: [] }; }

        function initDataListeners(code) {
            if (!code) return;
            cleanupListeners(); 
            const userId = `code_${code}`; 
            const refresh = () => { state.shouldRefreshContent = true; render(); };
            ['expense', 'income', 'wallets'].forEach(key => {
                const unsub = onSnapshot(query(collection(db, 'artifacts', appId, 'users', userId, getCollectionName(key))), (snapshot) => {
                    const items = []; snapshot.forEach((doc) => items.push({ id: doc.id, ...doc.data() })); state.data[key] = items; refresh();
                });
                state.unsubscribeListeners.push(unsub);
            });
            const unsubTx = onSnapshot(query(collection(db, 'artifacts', appId, 'users', userId, 'transactions')), (snapshot) => {
                const items = []; snapshot.forEach((doc) => items.push({ id: doc.id, ...doc.data() })); state.data.transactions = items.sort((a, b) => new Date(b.date) - new Date(a.date)); refresh();
            });
            state.unsubscribeListeners.push(unsubTx);
            const unsubDebt = onSnapshot(query(collection(db, 'artifacts', appId, 'users', userId, 'debts')), (snapshot) => {
                const items = []; snapshot.forEach((doc) => items.push({ id: doc.id, ...doc.data() })); state.data.debts = items.sort((a, b) => new Date(b.date) - new Date(a.date)); refresh();
            });
            state.unsubscribeListeners.push(unsubDebt);
        }

        window.app = {
            handleLoginInput: (val) => { state.loginCodeInput = val.toUpperCase().replace(/[^A-Z0-9]/g, ''); const el = document.getElementById('login-input'); if(el && el.value !== state.loginCodeInput) el.value = state.loginCodeInput; },
            login: (e) => { e.preventDefault(); if (!state.loginCodeInput || state.loginCodeInput.length < 3) return showNotification('Error', 'Kode minimal 3 karakter', 'error'); state.accessCode = state.loginCodeInput; localStorage.setItem('finance_access_code', state.accessCode); initDataListeners(state.accessCode); showNotification('Berhasil', 'Data berhasil dimuat', 'success'); state.shouldRefreshContent = true; render(); },
            logout: () => { triggerConfirm('Konfirmasi Keluar', 'Apakah Anda yakin ingin keluar?', () => { cleanupListeners(); state.accessCode = null; state.loginCodeInput = ''; localStorage.removeItem('finance_access_code'); state.activeMenu = 'dashboard'; const appDiv = document.getElementById('app'); appDiv.innerHTML = ''; render(); }, 'danger'); },
            setMenu: (menu) => { if (state.activeMenu !== menu) { state.activeMenu = menu; state.shouldRefreshContent = true; render(); } },
            setSettingsTab: (tab) => { state.settingsTab = tab; state.shouldRefreshContent = true; render(); },
            
            toggleExpandPerson: (personName) => { 
                state.expandedPerson = state.expandedPerson === personName ? null : personName;
                const safeId = personName.replace(/[^a-zA-Z0-9]/g, '_');
                const detailEl = document.getElementById(`details-${safeId}`);
                const iconEl = document.getElementById(`icon-${safeId}`);
                if (detailEl) {
                    const isClosed = detailEl.classList.contains('grid-rows-0');
                    if (isClosed) { detailEl.classList.remove('grid-rows-0'); detailEl.classList.add('grid-rows-1'); if (iconEl) iconEl.style.transform = 'rotate(180deg)'; } 
                    else { detailEl.classList.add('grid-rows-0'); detailEl.classList.remove('grid-rows-1'); if (iconEl) iconEl.style.transform = 'rotate(0deg)'; }
                }
            },
            
            setTxFilter: (field, value) => { state.filter[field] = value; state.shouldRefreshContent = true; render(); },
            setDashboardFilter: (field, value) => {
                state.dashboardFilter[field] = value;
                state.shouldRefreshContent = true; render();
            },
            resetDashboardFilter: () => { state.dashboardFilter = { type: 'all', walletId: 'all', startDate: getFirstDayOfMonth(), endDate: getLastDayOfMonth(), periodMode: 'monthly' }; state.shouldRefreshContent = true; render(); },
            
            // FIXED TOGGLE LOGIC: Toggles the opposite of current state
            toggleWalletExclusion: async (id, currentIsExcluded) => { 
                try { 
                    await updateDoc(doc(db, 'artifacts', appId, 'users', `code_${state.accessCode}`, 'wallets', id), { isExcluded: !currentIsExcluded }); 
                } catch (err) { console.error(err); } 
            },
            
            openSettingsModal: (mode, id = null, tabName = null) => {
                if (tabName) state.settingsTab = tabName; 
                if (mode === 'edit' && id) { const item = state.data[state.settingsTab].find(i => i.id === id); state.editingItem = item; state.settingsForm = { name: item.name, budget: item.budget || '', initialBalance: item.initialBalance || '', type: item.type || 'Cash', icon: item.icon, color: item.color }; } 
                else { state.editingItem = null; state.settingsForm = { name: '', budget: '', initialBalance: '', type: 'Cash', icon: 'more-horizontal', color: 'bg-slate-500' }; }
                state.isSettingsModalOpen = true; state.shouldRefreshContent = false; render();
            },
            openTransactionModal: () => { 
                state.editingTxId = null; 
                state.txForm = { type: 'expense', date: getToday(), amount: '', walletId: state.data.wallets[0]?.id || '', categoryId: '', notes: '' }; 
                state.isTransactionModalOpen = true; state.shouldRefreshContent = false; render(); 
            },
            
            editTransaction: (id) => {
                const tx = state.data.transactions.find(t => t.id === id);
                if (!tx) return;
                if (tx.type === 'transfer') {
                    state.transferForm = { date: tx.date, amount: tx.amount, fromWalletId: tx.fromWalletId, toWalletId: tx.toWalletId, notes: tx.notes || '' };
                    state.editingTxId = id;
                    state.isTransferModalOpen = true;
                } else {
                    state.txForm = { type: tx.type, date: tx.date, amount: tx.amount, walletId: tx.walletId, categoryId: tx.categoryId, notes: tx.notes || '' };
                    state.editingTxId = id;
                    state.isTransactionModalOpen = true;
                }
                state.shouldRefreshContent = false;
                render();
            },
            
            deleteTransaction: (id) => {
                triggerConfirm('Hapus Transaksi?', 'Data yang dihapus tidak bisa dikembalikan.', async () => {
                    try { await deleteDoc(window.app.getDocPath('transactions', id)); showNotification('Terhapus', 'Transaksi berhasil dihapus'); } catch (err) { console.error(err); }
                }, 'danger');
            },

            openTransferModal: () => { 
                state.editingTxId = null;
                const wallets = state.data.wallets; 
                state.transferForm = { date: getToday(), amount: '', fromWalletId: wallets[0]?.id || '', toWalletId: wallets[1]?.id || '', notes: '' }; 
                state.isTransferModalOpen = true; state.shouldRefreshContent = false; render(); 
            },
            openDebtModal: () => { 
                // Initialize with default wallet
                const defaultWallet = state.data.wallets[0]?.id || '';
                state.debtForm = { type: 'payable', person: '', amount: '', date: getToday(), dueDate: '', notes: '', isOldDebt: false, walletId: defaultWallet }; 
                state.isDebtModalOpen = true; state.shouldRefreshContent = false; render(); 
            },
            openPayDebtModal: (id) => { const debt = state.data.debts.find(d => d.id === id); if (!debt) return; state.selectedDebt = debt; state.payDebtForm = { date: getToday(), amount: debt.amount - (debt.paidAmount || 0), walletId: state.data.wallets[0]?.id || '', notes: '' }; state.isPayDebtModalOpen = true; state.shouldRefreshContent = false; render(); },
            closeAllModals: () => { state.isSettingsModalOpen = false; state.isTransactionModalOpen = false; state.isTransferModalOpen = false; state.isDebtModalOpen = false; state.isPayDebtModalOpen = false; state.shouldRefreshContent = false; render(); },
            
            setTxType: (type) => { state.txForm.type = type; state.txForm.categoryId = ''; render(); },
            setTxWallet: (id) => { state.txForm.walletId = id; render(); },
            selectCategory: (id) => { state.txForm.categoryId = id; render(); },
            setTransferWallet: (field, id) => { state.transferForm[field] = id; render(); },
            setDebtType: (type) => { state.debtForm.type = type; render(); },
            toggleDebtOld: (checked) => { state.debtForm.isOldDebt = checked; render(); },
            setDebtWallet: (id) => { state.debtForm.walletId = id; render(); }, // New setter for debt wallet
            setPayDebtWallet: (id) => { state.payDebtForm.walletId = id; render(); },
            
            updateForm: (formName, field, value) => { 
                state[formName][field] = value; 
                render(); 
            },
            
            handleNumberInput: (targetObj, field, el) => {
                let rawValue = el.value.replace(/\D/g, ''); if (rawValue.length > 1 && rawValue.startsWith('0')) rawValue = rawValue.substring(1);
                state[targetObj][field] = rawValue === '' ? '' : parseInt(rawValue, 10);
                const formatted = formatNumberString(rawValue);
                if (el.value !== formatted) { const start = el.selectionStart; const drift = formatted.length - el.value.length; el.value = formatted; const newPos = Math.max(0, start + drift); if(el.setSelectionRange) el.setSelectionRange(newPos, newPos); }
            },
            
            getDbPath: (col) => collection(db, 'artifacts', appId, 'users', `code_${state.accessCode}`, col),
            getDocPath: (col, id) => doc(db, 'artifacts', appId, 'users', `code_${state.accessCode}`, col, id),
            
            submitSettings: async (e) => { e.preventDefault(); if (!state.accessCode) return; const { settingsTab, settingsForm, editingItem } = state; const colName = getCollectionName(settingsTab); const newItem = { name: settingsForm.name, icon: settingsForm.icon, color: settingsForm.color, updatedAt: new Date().toISOString() }; if (settingsTab === 'wallets') { newItem.type = settingsForm.type; newItem.initialBalance = Number(settingsForm.initialBalance); } else { newItem.budget = Number(settingsForm.budget); } try { if (editingItem) { await updateDoc(window.app.getDocPath(colName, editingItem.id), newItem); showNotification('Sukses', 'Data diperbarui'); } else { newItem.createdAt = new Date().toISOString(); await addDoc(window.app.getDbPath(colName), newItem); showNotification('Sukses', 'Data ditambahkan'); } state.isSettingsModalOpen = false; render(); } catch (err) { console.error(err); showNotification('Error', 'Gagal simpan', 'error'); } },
            deleteSettingsItem: (tab, id) => { state.settingsTab = tab; triggerConfirm('Hapus Item?', 'Tindakan ini tidak dapat dibatalkan.', async () => { try { await deleteDoc(window.app.getDocPath(getCollectionName(tab), id)); showNotification('Dihapus', 'Data dihapus'); } catch (err) { console.error(err); } }, 'danger'); },
            
            submitTransaction: async (e) => { 
                e.preventDefault(); if (!state.accessCode) return; 
                const { txForm, editingTxId } = state; 
                if (!txForm.categoryId || !txForm.walletId || !txForm.amount) return showNotification('Peringatan', 'Data tidak lengkap', 'error'); 
                const txData = { type: txForm.type, date: txForm.date, amount: Number(txForm.amount), walletId: txForm.walletId, categoryId: txForm.categoryId, notes: txForm.notes, updatedAt: new Date().toISOString() }; 
                try { 
                    if (editingTxId) { await updateDoc(window.app.getDocPath('transactions', editingTxId), txData); showNotification('Sukses', 'Transaksi diperbarui'); }
                    else { txData.createdAt = new Date().toISOString(); await addDoc(window.app.getDbPath('transactions'), txData); showNotification('Transaksi', 'Dicatat'); }
                    state.isTransactionModalOpen = false; state.editingTxId = null; render(); 
                } catch (err) { console.error(err); showNotification('Error', 'Gagal', 'error'); } 
            },
            
            submitTransfer: async (e) => { 
                e.preventDefault(); if (!state.accessCode) return; 
                const { transferForm, editingTxId } = state; 
                if (!transferForm.fromWalletId || !transferForm.toWalletId || !transferForm.amount) return showNotification('Peringatan', 'Data tidak lengkap', 'error'); 
                const txData = { type: 'transfer', date: transferForm.date, amount: Number(transferForm.amount), fromWalletId: transferForm.fromWalletId, toWalletId: transferForm.toWalletId, notes: transferForm.notes, updatedAt: new Date().toISOString() }; 
                try { 
                    if (editingTxId) { await updateDoc(window.app.getDocPath('transactions', editingTxId), txData); showNotification('Sukses', 'Transfer diperbarui'); }

                id="tx-form">

                <!-- TYPE -->
                <div class="bg-slate-100 p-1 rounded-xl flex">
                    <button type="button"
                    onclick="app.setTxType('expense')"
                    class="flex-1 py-1.5 rounded-lg text-[11px] font-bold
                    ${isExpense ? 'bg-white text-rose-600 shadow' : 'text-slate-500'}">
                    Pengeluaran
                    </button>
                    <button type="button"
                    onclick="app.setTxType('income')"
                    class="flex-1 py-1.5 rounded-lg text-[11px] font-bold
                    ${!isExpense ? 'bg-white text-emerald-600 shadow' : 'text-slate-500'}">
                    Pemasukan
                    </button>
                </div>

                <!-- DATE -->
                <div class="${DS.sectionGap}">
                    <label class="${DS.label}">Tanggal</label>
                    <input type="date"
                    value="${txForm.date}"
                    onchange="app.updateForm('txForm','date',this.value)"
                    class="${DS.input}">
                </div>

                <!-- AMOUNT -->
                <div class="${DS.sectionGap}">
                    <label class="${DS.label}">Nominal</label>
                    <div class="relative">
                    <span class="currency-prefix">Rp</span>
                    <input type="text"
                        value="${displayAmount}"
                        oninput="app.handleNumberInput('txForm','amount',this)"
                        class="${DS.input} pl-12 text-base font-bold ${isExpense ? 'text-rose-600' : 'text-emerald-600'}"
                        placeholder="0">
                    </div>
                </div>

                <!-- WALLET -->
                <div class="${DS.sectionGap}">
                    <label class="${DS.label}">Dompet Sumber</label>
                    ${data.wallets.length === 0
                    ? `<p class="text-[10px] text-rose-500">Buat dompet dulu.</p>`
                    : `
                    <div class="grid grid-cols-2 ${DS.gridGap}">
                    ${data.wallets.map(w => `
                        <button type="button"
                        onclick="app.setTxWallet('${w.id}')"
                        class="p-2 rounded-lg border text-left flex items-center gap-2
                        ${txForm.walletId === w.id
                            ? 'bg-blue-50 border-blue-500'
                            : 'bg-white border-slate-200'}">
                        <div class="w-6 h-6 rounded-md flex items-center justify-center text-white ${w.color}">
                            <i data-lucide="${w.icon}" width="12"></i>
                        </div>
                        <span class="text-[11px] font-bold truncate">${w.name}</span>
                        </button>
                    `).join('')}
                    </div>`}
                </div>

                <!-- CATEGORY -->
                <div class="${DS.sectionGap}">
                    <label class="${DS.label}">Kategori</label>
                    ${categories.length === 0
                    ? `<p class="text-[10px] text-slate-400">Belum ada kategori.</p>`
                    : `
                    <div class="grid grid-cols-4 ${DS.gridGap}">
                    ${categories.map(cat => `
                        <button type="button"
                        onclick="app.selectCategory('${cat.id}')"
                        class="flex flex-col items-center p-2 rounded-lg border
                        ${txForm.categoryId === cat.id
                            ? 'bg-blue-50 border-blue-500'
                            : 'bg-white border-slate-200'}">
                        <div class="w-7 h-7 rounded-md flex items-center justify-center text-white ${cat.color}">
                            <i data-lucide="${cat.icon}" width="12"></i>
                        </div>
                        <span class="text-[9px] font-bold truncate w-full text-center">${cat.name}</span>
                        </button>
                    `).join('')}
                    </div>`}
                </div>

                <!-- NOTES -->
                <div class="${DS.sectionGap}">
                    <label class="${DS.label}">Catatan</label>
                    <textarea rows="2"
                    oninput="app.updateForm('txForm','notes',this.value)"
                    class="${DS.input} resize-none text-xs"
                    placeholder="Keterangan...">${txForm.notes || ''}</textarea>
                </div>

                <!-- SPACER FOR STICKY BUTTON -->
                <div class="h-24"></div>
                </form>

                <!-- STICKY ACTION -->
                <div class="sticky bottom-0 bg-white border-t ${DS.stickyBar}">
                <button type="submit" form="tx-form" class="w-full btn-primary py-2.5">
                    Simpan
                </button>
                </div>

            </div>
            </div>`;
            };

            /* =========================================================
            3) TRANSFER MODAL
            ========================================================= */
            window.app.renderTransferModalOriginalHTML = function() {
            const { transferForm } = state;
            const displayAmount = transferForm.amount ? formatNumberString(String(transferForm.amount)) : '';

            return `
            <div class="fixed inset-0 z-50 flex items-center justify-center p-3">
            <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="app.closeAllModals()"></div>

            <div class="bg-white ${DS.radius} w-full max-w-md max-h-[92vh] shadow-xl flex flex-col overflow-hidden">

                <div class="${DS.headerPad} border-b flex justify-between items-center sticky top-0 bg-white/90">
                <h3 class="font-bold text-base">Transfer Aset</h3>
                <button onclick="app.closeAllModals()" class="p-2 bg-slate-100 rounded-full">
                    <i data-lucide="x" width="18"></i>
                </button>
                </div>

                <form onsubmit="app.submitTransfer(event)" class="flex-1 overflow-y-auto ${DS.modalPad} ${DS.formGap}">

                <div class="${DS.sectionGap}">
                    <label class="${DS.label}">Nominal</label>
                    <div class="relative">
                    <span class="currency-prefix">Rp</span>
                    <input type="text"
                        value="${displayAmount}"
                        oninput="app.handleNumberInput('transferForm','amount',this)"
                        class="${DS.input} pl-12 text-lg font-bold"
                        placeholder="0">
                    </div>
                </div>

                <div class="h-20"></div>
                </form>

                <div class="sticky bottom-0 bg-white border-t ${DS.stickyBar}">
                <button class="w-full btn-primary">Proses Transfer</button>
                </div>
            </div>
            </div>`;
            };

            /* =========================================================
            4) DEBT MODAL
            ========================================================= */
            window.app.renderDebtModalOriginalHTML = function() {
            const { debtForm } = state;
            const displayAmount = debtForm.amount ? formatNumberString(String(debtForm.amount)) : '';

            return `
            <div class="fixed inset-0 z-50 flex items-center justify-center p-3">
            <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="app.closeAllModals()"></div>

            <div class="bg-white ${DS.radius} w-full max-w-md max-h-[92vh] shadow-xl flex flex-col overflow-hidden">

                <div class="${DS.headerPad} border-b flex justify-between items-center sticky top-0 bg-white/90">
                <h3 class="font-bold text-base">Catat Hutang / Piutang</h3>
                <button onclick="app.closeAllModals()" class="p-2 bg-slate-100 rounded-full">
                    <i data-lucide="x" width="18"></i>
                </button>
                </div>

                <form onsubmit="app.submitDebt(event)" class="flex-1 overflow-y-auto ${DS.modalPad} ${DS.formGap}">

                <div class="${DS.sectionGap}">
                    <label class="${DS.label}">Nominal</label>
                    <div class="relative">
                    <span class="currency-prefix">Rp</span>
                    <input type="text"
                        value="${displayAmount}"
                        oninput="app.handleNumberInput('debtForm','amount',this)"
                        class="${DS.input} pl-12 text-lg font-bold"
                        placeholder="0">
                    </div>
                </div>

                <div class="h-20"></div>
                </form>

                <div class="sticky bottom-0 bg-white border-t ${DS.stickyBar}">
                <button class="w-full btn-primary">Simpan</button>
                </div>
            </div>
            </div>`;
            };

            /* =========================================================
            5) PAY DEBT MODAL
            ========================================================= */
            window.app.renderPayDebtModalOriginalHTML = function() {
            const { payDebtForm } = state;
            const displayAmount = payDebtForm.amount ? formatNumberString(String(payDebtForm.amount)) : '';

            return `
            <div class="fixed inset-0 z-50 flex items-center justify-center p-3">
            <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="app.closeAllModals()"></div>

            <div class="bg-white ${DS.radius} w-full max-w-md max-h-[92vh] shadow-xl flex flex-col overflow-hidden">

                <div class="${DS.headerPad} border-b flex justify-between items-center sticky top-0 bg-white/90">
                <h3 class="font-bold text-base">Pembayaran</h3>
                <button onclick="app.closeAllModals()" class="p-2 bg-slate-100 rounded-full">
                    <i data-lucide="x" width="18"></i>
                </button>
                </div>

                <form onsubmit="app.submitDebtPayment(event)" class="flex-1 overflow-y-auto ${DS.modalPad} ${DS.formGap}">

                <div class="${DS.sectionGap}">
                    <label class="${DS.label}">Nominal</label>
                    <div class="relative">
                    <span class="currency-prefix">Rp</span>
                    <input type="text"
                        value="${displayAmount}"
                        oninput="app.handleNumberInput('payDebtForm','amount',this)"
                        class="${DS.input} pl-12 text-lg font-bold"
                        placeholder="0">
                    </div>
                </div>

                <div class="h-20"></div>
                </form>

                <div class="sticky bottom-0 bg-white border-t ${DS.stickyBar}">
                <button class="w-full btn-primary">Proses</button>
                </div>
            </div>
            </div>`;
            };

        window.app.renderAllModals = function() {
            if (state.isSettingsModalOpen) return window.app.renderSettingsModalOriginalHTML();
            if (state.isTransactionModalOpen) return window.app.renderTxModalOriginalHTML();
            if (state.isTransferModalOpen) return window.app.renderTransferModalOriginalHTML();
            if (state.isDebtModalOpen) return window.app.renderDebtModalOriginalHTML();
            if (state.isPayDebtModalOpen) return window.app.renderPayDebtModalOriginalHTML();
            return '';
        };

        render();
    </script>
</body>
</html>
